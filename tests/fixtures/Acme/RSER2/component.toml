[part]
value = "RSER2"
manufacturer = "Acme"
description = "Test resistor series with tolerance options, 0402"
category = "resistor"
package = "0402"
datasheet_url = "https://example.com/rser2.pdf"
datasheet_rev = "A"
datasheet_date = "2020-01"
kicad_symbol = "RSER2.kicad_sym"
kicad_footprint = "RSER2.kicad_mod"
step = "none"
series = "resistor"
value_param = "res_range"
e_series = ["VISHAY-DECADE"]
series_power = "p70"
series_tolerances = { B = { tol = "tol_b", range = "r_range_b" }, D = { tol = "tol_d", range = "r_range_d" }, F = { tol = "tol_f", range = "r_range_f" } }
series_tcr = [{ tcr = "tcr_lo", range = "tcr_lo_range" }, { tcr = "tcr_hi", range = "tcr_hi_range" }]

[[pin]]
number = "1"
name = "1"
type = "passive"
function = "Terminal 1"
cite = "DS p.2, Dimensions, terminal 1"

