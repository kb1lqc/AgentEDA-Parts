# VNF1248F: high-side switch controller with intelligent fuse protection (eFuse), 6-60 V (70 V transient), AEC-Q100,
# QFN32L 5x5 mm with Epad. Raw datasheet values in printed units (docs/SPEC.md).
# Source: docs/datasheets/DS_vnf1248f.pdf, DS14109 Rev 8 (09-Jul-2026). Printed page numbers are cited (PDF page = printed page).
# Only the order code VNF1248FTR (tape and reel, DS p.74 Table 67) is covered: no other package or option is printed.
# General test condition (DS p.6, 2.3): 6 V < VS < 60 V; -40 degC < TJ < 150 degC unless otherwise specified; typical values
# at VS = 48 V, TJ = 25 degC. Electrical rows without a stated temperature are scope "full" (over TJ -40 to 150 degC);
# rows with TJ = 25 degC in their conditions are scope "25C". The DS prints no ambient (TA) range: all temperature scopes
# are junction temperature (TJ). Percent offsets printed in the Min/Max columns around a typ are stored as tol_pct = [lo, hi] (%) on that typ row.
# Programmable (SPI-selectable) thresholds: one key per printed setting, typ only (the DS prints no min/max per setting).
# Abs-max voltages are stored as printed (no reference pin is stated; read as voltage to GND, see notes).
# The DS gives no reference pin for the abs-max table, so min_ref/max_ref are only used where the DS prints a formula.
# Revision currency, errata, PCN and lifecycle: not checked (no web access).

[part]
value           = "VNF1248F"
mpn             = "VNF1248FTR"
alternates      = []                          # none: VNF1248FTR is the only order code (DS p.74 Table 67, tape and reel)
manufacturer    = "STMicroelectronics"
description     = "High-side switch controller with intelligent fuse protection, 6-60 V (70 V transient), AEC-Q100, QFN32L 5x5 mm"
category        = "high_side_controller"
package         = "QFN32L 5x5 mm Epad, wettable flanks (DS p.69 Figure 22, DS p.70 Table 65)"
datasheet_url   = "https://www.st.com/resource/en/datasheet/vnf1248f.pdf"   # DS prints only www.st.com (DS p.1); fallback URL, not web-verified
datasheet_file  = "docs/datasheets/DS_vnf1248f.pdf"
datasheet_rev   = "Rev 8"                     # DS14109 - Rev 8 (DS p.1 footer, p.76 Revision history)
datasheet_date  = "2026-07"                   # DS p.76 Table 68: revision 8, 09-Jul-2026
temp_grade      = "TJ -40 to 150 degC"        # DS p.5 Table 2 (TJ) and p.6 2.3 general condition; no TA range printed; AEC-Q100 grade not printed
kicad_symbol    = "VNF1248F.kicad_sym"
kicad_footprint = "VNF1248F.kicad_mod"
step            = "VNF1248F.step"
# OPEN ITEM: the STEP model is the vendor file. Its bounding box is 5.156 x 5.156 x 1.654 mm vs DS 5.00 BSC x 1.00 max
# (DS p.70 Table 65). Not DS-dimensioned: do not use it for height or clearance checks.


# Pins: DS p.4 Table 1 (pin 1 to 31 plus the TAB row) and DS p.3 Figure 2 (top view). Figure 2 and Table 1 agree on every
# pin number and name. Names are the DS names; N.C. pins are named "N.C" as Table 1 prints them, type no_connect. The exposed pad (TAB) is a pin named GND per the library rule for an exposed pad
# that must connect to ground.

[[pin]]
number   = "1"
name     = "VSPI"
type     = "power_in"
function = "DS: DC supply input for the SPI interface. 3.3 V and 5 V are compatible."
cite     = "DS p.4, Table 1. Pin functions, VSPI"

[[pin]]
number   = "2"
name     = "CSN"
type     = "input"
function = "Chip select (active low) for SPI communication. CMOS compatible input."
cite     = "DS p.4, Table 1. Pin functions, CSN"

[[pin]]
number   = "3"
name     = "SDI"
type     = "input"
function = "Serial data input for SPI communication, sampled on SCK rising edge (connected to MOSI)."
cite     = "DS p.4, Table 1. Pin functions, SDI"

[[pin]]
number   = "4"
name     = "SDO"
type     = "tri_state"
function = "Serial data output for SPI communication, shifted out on SCK falling edge (connected to MISO). DS Table 7: SDO tristate after CSN rising edge."
