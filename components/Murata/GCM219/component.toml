# Murata GCM219 series: 2012M (0805) thickness code 9 (0.85 mm) X7R (R7) and C0G (5C) MLCCs, a capacitor series
# (docs/SPEC.md, "Capacitor series"). One directory per Murata size+thickness code (the symbol, footprint and STEP are per
# directory). Every orderable value is a row of catalog.csv, generated from Murata's product-list export by
#   python3 -m lib.catalog murata-gcm docs/vendor/Murata_GCM/series-product-list.csv components/Murata/GCM219 --dielectrics X7R,C0G
# and cited per row to that export (a manufacturer export, not a datasheet). X7R and C0G rows are listed; each
# dielectric has its temperature-characteristic row (tc_x7r, tc_c0g) and its operating-temperature row (op_temp_*).
# Row scopes: rows without a restriction apply to every part; rows with dielectric = "X7R" / "C0G" to every part of that
# dielectric; rows with parts = [...] only to the catalog values named there.
# The per-part rows come from the one reference sheet this directory has for C0G: GCM2195C1H123FA16 (12000pF, +/-1 %,
# DC 50V, T 0.85 mm), docs/datasheets/GCM2195C1H123FA16-01A-EN.pdf (Murata reference sheet, "product specifications
# as of Apr.8,2026"). The other catalog values (C0G and X7R, 0.85 mm) have no per-part datasheet rows (open item).
# Shared rows: the land rows (land_*_015, land_*_020) come from the GCM21B X7R reference sheet, DS p.27 (shared by every 0805
# directory). Dielectric rows: the C0G rows come from this directory's C0G sheet, the X7R rows from the X7R sheet of GCM21B
# (docs/datasheets/GCM21BR72A104KA37-01A-EN.pdf, DS p.2); both dielectrics are listed in this directory.
# Lifecycle, revision currency, errata and PCN: not checked (no web access).
#
# Part decode (DS p.2, MURATA Part No. System, example GCM2195C1H123FA16-01A): GCM series, 21 = L x W 2012M (0805) 2.0 x 1.25,
# 9 = T 0.85 mm (thickness code 9), 5C = C0G (EIA), 1H = DC 50V, 12000 pF,
# F = +/-1 %, A16 = individual specification (Murata control code), D/J = package (see below). R7 = X7R (EIA) in the X7R sheet.
# Package letters (DS p.2 Package table, this C0G sheet, thickness 0.85 mm): D = phi180 reel, paper tape W8P4,
#   4000 pcs/reel; J = phi330 reel, paper tape W8P4, 10000 pcs/reel. The package table is taken from this one sheet and
#   assumed for both dielectrics of thickness code 9 (open item: the X7R 0.85 mm parts have no X7R sheet
#   of this thickness to confirm it).
#   MPN = catalog value + package letter; default letter D; J is the same part in other packaging.
# The decode tables in lib/catalog.py are a cross-check of the export only ("Not a DS rule"): the reference sheet decodes
# just its own example number.
#
# Open items (DS gives no numbers, so nothing is stored):
#   - DC voltage characteristic (X7R capacitance loss under DC bias): the X7R sheet of GCM21B prints a figure for another
#     sample (0.1 uF, 50 VDC); no number is printed for this thickness, so nothing is stored as a bound. capacitance_worst_pct
#     and capacitance_worst_ppm exclude it.
#   - AC voltage characteristic: text only. Self-heating and the AC peak rule are stored (self_heating, ac_peak) on the X7R
#     reference sheet only (GCM21B); this thickness has no X7R sheet, so they are not repeated here.
#   - Aging (capacitance decrease with time): DS p.14, section 6 (generic high-dielectric note), text only; no rate printed.
#   - Operating temperature range is a single row (-55 to 125 degC); no derating curve is printed.
#   - Thickness code 9 exists in the export for X7R and C0G: their L/W/T class is the export's, not a datasheet's.
#   - Land pattern: footprint uses a 1.2 / b 0.7 / c 1.3 mm, chosen to fit both rows of GCM21BR72A104KA37-01A DS p.27
#     (2.0x1.25 +/-0.15 and +/-0.20). The older GCM21A5C2E101FX01-00B sheet (DS p.29) prints a different single row,
#     not used (open item).
#   - L/W tolerance class: this sheet is +/-0.15 (L 2.0, W 1.25); the export also has +/-0.2 rows for this thickness, which
#     have no sheet (open item). The per-part size rows apply to the reference part only.
#   - Qualification rows not stored (as GCM21A): visual, dimensions, solvents, mechanical shock, vibration, soldering heat,
#     ESD (DS p.3-5 No. 9-15), DPA (No. 5), voltage proof (No. 21), board-flex Q/IR (No. 22), terminal strength (No. 23).
#     Rows that differ from the GCM21A C0G sheet are listed in the judgement notes below.
# Product URL: the reference sheet prints no product page address other than a site reference; datasheet_url is empty
# (open item); datasheet_file is the source.

[part]
value           = "GCM219"                    # series: the catalog values are rows of catalog.csv
manufacturer    = "Murata"
description     = "Chip multilayer ceramic capacitors, X7R (R7) and C0G (5C), 2012M (0805), thickness 0.85 mm (code 9), AEC-Q200 (GCM series)"
category        = "capacitor_mlcc"
package         = "2012M (0805)"
kicad_symbol    = "GCM219.kicad_sym"
kicad_footprint = "GCM219.kicad_mod"
step            = "GCM219.step"
datasheet_url   = ""  # open item: the reference sheet prints no datasheet URL; use datasheet_file
datasheet_file  = "docs/datasheets/GCM2195C1H123FA16-01A-EN.pdf"  # C0G reference sheet of GCM2195C1H123FA16; the per-part rows come from it
datasheet_rev   = "01A"
datasheet_date  = "2026-04"                   # DS p.2 "product specifications in this catalog are as of Apr.8,2026"
series          = "capacitor"
catalog         = "catalog.csv"
catalog_decoder = "murata-gcm"          # lib.check re-decodes every row (lib/catalog.py tables, cross-check only)
tc_param        = { X7R = "tc_x7r", C0G = "tc_c0g" }  # dielectric -> the row holding its temperature characteristic
package_default    = "D"                      # DS p.2 Package table: D = phi180 reel, paper tape
package_alternates = ["J"]                    # DS p.2 Package table: J = phi330 reel, paper tape (packaging only)

# Pins: DS p.2 Type & Dimension figure. Non-polarized two-terminal chip capacitor; pin names are the terminal numbers.

[[pin]]
number   = "1"
name     = "1"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

[[pin]]
number   = "2"
name     = "2"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

# Land pattern (footprint, reflow), shared by every 0805 directory. Source: the GCM21B X7R reference sheet
# (docs/datasheets/GCM21BR72A104KA37-01A-EN.pdf), DS p.27, "2. Land Dimensions", Table 2 Reflow Soldering Method, row
# 2.0x1.25 (both tolerance rows). The DS labels the dimensions only by letter: neutral names. Inferred meaning, not
# printed: a = land-to-land gap, b = land length, c = land width (as for GCM188). Footprint used: a 1.2 / b 0.7 / c 1.3 mm,
# chosen to fit both rows (a 1.2 is inside 1.0-1.4 and 1.2; b 0.7 is inside 0.6-0.8; c 1.3 is inside 1.2-1.4).

[param.land_a_015]
name       = "Land pattern dimension a (reflow)"
symbol     = "a"
kind       = "mechanical"
scope      = "na"
min        = 1.2
max        = 1.2
unit       = "mm"
conditions = "Reflow soldering, chip 2.0x1.25 (+/-0.15), code 21"
cite       = "DS p.27 (GCM21BR72A104KA37-01A-EN.pdf), 2. Land Dimensions, Table 2 Reflow Soldering Method, 2.0x1.25 (+/-0.15), a"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: gap between lands (not printed). Row for the +/-0.15 chip; the +/-0.20 row is land_a_020."

[param.land_b_015]
name       = "Land pattern dimension b (reflow)"
symbol     = "b"
kind       = "mechanical"
scope      = "na"
min        = 0.6
max        = 0.8
unit       = "mm"
conditions = "Reflow soldering, chip 2.0x1.25 (+/-0.15), code 21"
cite       = "DS p.27 (GCM21BR72A104KA37-01A-EN.pdf), 2. Land Dimensions, Table 2 Reflow Soldering Method, 2.0x1.25 (+/-0.15), b"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: land length, outer side (not printed)."

[param.land_c_015]
name       = "Land pattern dimension c (reflow)"
symbol     = "c"
kind       = "mechanical"
scope      = "na"
min        = 1.2
max        = 1.4
unit       = "mm"
conditions = "Reflow soldering, chip 2.0x1.25 (+/-0.15), code 21"
cite       = "DS p.27 (GCM21BR72A104KA37-01A-EN.pdf), 2. Land Dimensions, Table 2 Reflow Soldering Method, 2.0x1.25 (+/-0.15), c"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: land width across the chip (not printed)."

[param.land_a_020]
name       = "Land pattern dimension a (reflow)"
symbol     = "a"
