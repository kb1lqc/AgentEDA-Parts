unit       = "mm"
conditions = "Reflow soldering, chip 2.0x1.25 (+/-0.20), code 21"
cite       = "DS p.27 (GCM21BR72A104KA37-01A-EN.pdf), 2. Land Dimensions, Table 2 Reflow Soldering Method, 2.0x1.25 (+/-0.20), b"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: land length, outer side (not printed)."

[param.land_c_020]
name       = "Land pattern dimension c (reflow)"
