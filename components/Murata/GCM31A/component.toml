# Murata GCM31A series: 3216M (1206) C0G (5C), thickness 1.0 mm (code A) capacitance series (docs/SPEC.md, "Capacitor series"). One directory per Murata
# size+thickness code (the symbol, footprint and STEP are per directory). Every orderable value is a row of catalog.csv,
# generated from Murata's product-list export by
#   python3 -B -m lib.catalog murata-gcm docs/vendor/Murata_GCM/gcm-series-product-list-2026-11-14.csv components/Murata/GCM31A --dielectrics X7R,C0G
# and cited per row to that export (a manufacturer export, not a datasheet). Lifecycle, revision currency, errata and PCN:
# not checked (no web access). Row scopes: rows without a restriction apply to every part; rows with dielectric = "X7R" /
# "C0G" to every part of that dielectric; rows with parts = [...] only to the catalog values named there.
# Shared rows: the land rows (land_*_020, land_*_030) from the -01A 1206 X7R sheet, DS p.28 (same rows as the GCM31M and GCM319
# -01A sheets, p.27). Footprint: a 1.9 / b 1.1 / c 1.7 mm, chosen to fit both printed rows (a 1.9 is inside 1.8-2.0 and
# 1.9-2.1; b 1.1 is inside 0.9-1.2 and 1.0-1.3; c 1.7 is inside 1.5-1.7 and 1.7-1.9).
#
# Part decode (DS p.2, example GCM31A5C2J101FX01-00B): GCM series, 31 = 3216M (1206), A = T 1.0 mm (thickness code A),
# 5C = C0G (EIA), 2J = DC 630 V, 101 = 100 pF, F = +/-1 %, X01 = individual specification (Murata control code), D/J = package.
# The catalog holds C0G only (147 rows; the export has no X7R 1.0 mm 1206 part).
# Per-part rows: GCM31A5C2J101FX01 (100 pF, +/-1 %, DC 630 V), reference sheet docs/datasheets/GCM31A5C2J101FX01-00B-EN.pdf,
# "product specifications as of Apr.11,2026". Other catalog values have no per-part datasheet rows (open item).
# Package letters (DS p.2 Package table, this -00B sheet): D = phi180 reel, PAPER tape W8P4, 4000 pcs/reel; J = phi330 reel,
# PAPER tape W8P4, 10000 pcs/reel. Confirmed on this sheet (p.2). MPN = catalog value + D; J is the same part.
# Differences of the -00B sheet from the -01A 1206 sheets (values stored as printed on this sheet):
#   - Thickness 1.0 +0/-0.3 (the -01A sheets print 1.15 / 0.85 / 1.25 with +/-0.1); L and W print +/-0.2 (the -01A C0G sheets +/-0.15).
#   - Q measured at 1.0 +/-0.1 MHz, 0.5 to 5.0 Vrms (the -01A sheets: 1.0 kHz, 1.0 Vrms).
#   - High-temperature exposure and temperature cycling: Q "Within the specified initial value" (the -01A sheets print Q>=1000);
#     capacitance change +/-2 % (the -01A sheets +/-2.5 %); temperature cycling mounted by reflow, 15 min dwell (the -01A sheets 30 min, solder).
#   - IR at 25 degC: More than 100000 MOhm at DC 500 V (the -01A sheets print Ohm*F at rated voltage).
#   - High-temperature operating life at 120 % of the rated voltage (the -01A sheets 200 %).
#   - Voltage proof 150 % (the -01A sheets 250 %); board flex prints no IR row.
#   - Beam load: more than 15 N at 2.5 mm/s (the -01A sheets 0.5 mm/s).
# Open items (DS gives no numbers, so nothing is stored):
#   - Land pattern: the -00B sheet's own land table (DS p.29, 3.2x1.6, one row, no tolerance split) prints a 2.2-2.4, b 0.8-0.9,
#     c 1.0-1.4 mm. That row differs from the -01A rows used here (land_*_020/030). The footprint (a 1.9) does NOT fit the -00B row.
#     Not used: open item for the footprint owner.
#   - Aging (capacitance decrease with time): not read on this sheet; not stored.
#   - Operating temperature range is a single row (-55 to 125 degC); no derating curve is printed.
#   - Capacitance drift between -10 and 25 degC has no printed number (C0G Table A covers -55 to -10 only).
#   - Stress rows printed as text are stored as text.
#   - Product URL: the reference sheet prints no product page address; datasheet_url says so (open item).

[part]
value           = "GCM31A"                    # series: the catalog values are rows of catalog.csv
manufacturer    = "Murata"
description     = "Chip multilayer ceramic capacitors, C0G (5C), 3216M (1206), thickness 1.0 mm (code A), AEC-Q200 (GCM series)"
category        = "capacitor_mlcc"
package         = "3216M (1206)"
kicad_symbol    = "GCM31A.kicad_sym"
kicad_footprint = "GCM31A.kicad_mod"
step            = "GCM31A.step"
datasheet_url   = ""  # open item: the reference sheet prints no datasheet URL (only a contact form); use datasheet_file
datasheet_file  = "docs/datasheets/GCM31A5C2J101FX01-00B-EN.pdf"
datasheet_rev   = "00B"
datasheet_date  = "2026-04"
series          = "capacitor"
catalog         = "catalog.csv"
catalog_decoder = "murata-gcm"          # lib.check re-decodes every row (lib/catalog.py tables, cross-check only)
tc_param        = { C0G = "tc_c0g" }  # dielectric -> the row holding its temperature characteristic
package_default    = "D"
package_alternates = ["J"]

# Pins: DS p.2 Type & Dimension figure. Non-polarized two-terminal chip capacitor; pin names are the terminal numbers.

[[pin]]
number   = "1"
name     = "1"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

[[pin]]
number   = "2"
name     = "2"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

