unit       = "%"
conditions = "Reference 25 degC, no bias; measured at -30 degC"
cite       = "DS p.7, Table A Capacitance Change between at Reference Temp. and at each Temp. (%), 5C, -30 degC"
note       = "Printed Max 0.4, Min -0.17: stored as min -0.17, max 0.4 (printed columns). Covers only the -30 degC point."

[param.capdrift_m10_c0g]
