kind       = "electrical"
scope      = "partial"
min        = -0.24
max        = 0.58
unit       = "%"
conditions = "Reference 25 degC, no bias; measured at -55 degC"
cite       = "DS p.7, Table A Capacitance Change between at Reference Temp. and at each Temp. (%), 5C, -55 degC"
note       = "Printed Max 0.58, Min -0.24: stored as min -0.24, max 0.58 (printed columns). Covers only the -55 degC point."

[param.capdrift_m30_c0g]
