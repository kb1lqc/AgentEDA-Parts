# C0G dielectric rows (dielectric 5C, Murata public code C0G (EIA)). Source: the C0G reference sheet GCM32D5C3A682GX01
# (DS p.2, p.6-7), identical to GCM32D5C2J123FX01 and to the 1210 C0G sheet of GCM32E (same 5C characteristic).

[param.tc_c0g]
dielectric = "C0G"
name       = "Temperature characteristic, C0G (EIA)"
symbol     = "TC"
kind       = "electrical"
scope      = "partial"
min        = -30
max        = 30
unit       = "ppm/degC"
conditions = "Ref. temp 25 degC; temp range printed as 25 to 125 degC; coefficient 0 +/-30 ppm/degC"
cite       = "DS p.2 (C0G sheet GCM32D5C3A682GX01), Rated Value, Temp. coeff. or Cap. Change (0+/-30 ppm/degC), Temp. Range (25 to 125 degC)"
note       = "Public STD code C0G (EIA). A temperature coefficient, not a percent-change class. The DS prints the range 25 to 125 degC only: no coefficient is printed below 25 degC. The -55 to -10 degC capacitance drift is in the Table A rows (capdrift_*_c0g); the -10 to 25 degC segment has no printed number (open item). capacitance_worst_ppm requires dt and refuses values outside 0 to 100 degC (docs/SPEC.md, Capacitor series)."

[param.op_temp_c0g]
dielectric = "C0G"
name       = "Operating temperature range"
kind       = "rec_op"
scope      = "na"
min        = -55
max        = 125
unit       = "degC"
conditions = ""
cite       = "DS p.2 (C0G sheet GCM32D5C3A682GX01), Rated Value, Operating Temp. Range (-55 to 125 degC)"
check_ambient = true
note       = "Read from the C0G reference sheet of GCM32D5C3A682GX01 (the 123 sheet prints the same). lib.catalog refuses an export row whose Operating Temperature is not -55 to 125 degC, so every C0G catalog row uses it."

# Table A (DS p.7 of the C0G sheet): capacitance change between the reference temperature (25 degC) and each stated temperature, 5C.
# Printed as Max. and Min. columns in %. Identical on all three 1210 C0G sheets (GCM32D5C3A682GX01, GCM32D5C2J123FX01, GCM32E5C2J223FX03).

