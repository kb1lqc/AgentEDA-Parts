# Murata GCM32D series: 3225M (1210) thickness code D (T 2.0 mm) X7R (R7) and C0G (5C) MLCCs, a capacitor series
# (docs/SPEC.md, "Capacitor series"). One directory per Murata size+thickness code (the symbol, footprint and STEP are per
# directory). Every orderable value is a row of catalog.csv, generated from Murata's product-list export by
#   python3 -m lib.catalog murata-gcm docs/vendor/Murata_GCM/gcm-series-product-list-2026-11-14.csv components/Murata/GCM32D --dielectrics X7R,C0G
# and cited per row to that export (a manufacturer export, not a datasheet). X7R and C0G rows are listed; each
# dielectric has its temperature-characteristic row (tc_x7r, tc_c0g) and its operating-temperature row (op_temp_*).
# Row scopes: rows without a restriction apply to every part; rows with dielectric = "X7R" / "C0G" to every part of that
# dielectric; rows with parts = [...] only to the catalog values named there.
# The per-part rows come from the two C0G reference sheets of this directory: GCM32D5C3A682GX01 (6800 pF, DC 1000 V, +/-2 %)
# and GCM32D5C2J123FX01 (12000 pF, DC 630 V, +/-1 %), both docs/datasheets/*-00B-EN.pdf (Murata reference sheets, "product
# specifications as of Apr.13,2026"). No X7R reference sheet exists for thickness code D: the X7R catalog values have no
# per-part rows (open item). Dielectric rows: the C0G rows come from the C0G sheet GCM32D5C3A682GX01 (DS p.2, p.6-7); the
# X7R rows come from the 1210 X7R reference sheet GCM32ER71C226ME19-01A (DS p.2), which covers all 1210 X7R values.
# Lifecycle, revision currency, errata and PCN: not checked (no web access).
#
# Part decode (DS p.2, MURATA Part No. System, example GCM32D5C3A682GX01-00B): GCM series, 32 = L x W 3225M (1210) 3.2 x 2.5,
# D = T 2.0 mm (thickness code D), 5C = C0G (EIA), 3A = DC 1000 V, 682 = 6800 pF, G = +/-2 %, X01 = individual specification
# (Murata control code), L/K = package (see below). R7 = X7R (EIA) in the X7R sheet.
# Package letters (DS p.2 Package table, C0G sheet, thickness 2.0 mm): L = phi180 reel, plastic tape W8P4, 1000 pcs/reel;
#   K = phi330 reel, plastic tape W8P4, 4000 pcs/reel. The package table is taken from this one sheet (2.0 mm) and assumed for
#   both dielectrics of thickness code D (open item: the X7R 2.0 mm parts have no X7R 2.0 mm sheet to confirm it; the X7R 1210
#   sheet of thickness code E prints the same L/K letters and quantities).
#   MPN = catalog value + package letter; default letter L; K is the same part in other packaging.
# The decode tables in lib/catalog.py are a cross-check of the export only ("Not a DS rule"): the reference sheets decode
# just their own example numbers.
#
# Open items (DS gives no numbers, so nothing is stored):
#   - DC voltage characteristic (X7R capacitance loss under DC bias): the DS figure is an example for another sample
#     (0.1 uF, 50 VDC, DS p.14 section 5 of the X7R sheet); no number is printed, so nothing is stored as a bound (see dc_bias).
#     capacitance_worst_pct/_ppm exclude it.
#   - AC voltage characteristic: text only. The AC peak rule is stored (ac_peak). Self-heating for the X7R 2.0 mm parts is
#     not stored (no X7R 2.0 mm sheet; the 1210 X7R sheet of thickness code E is used only for the E directory).
#   - Aging (capacitance decrease with time): DS p.15 (section 6, text only, of the X7R 1210 sheet) and DS p.16 (C0G); no rate printed.
#   - Operating temperature range is a single row (-55 to 125 degC); no derating curve is printed.
#   - L/W/T of the X7R 2.0 mm parts: the export's class (thickness 2.0 mm) is not confirmed by a sheet (open item).
#   - Land pattern: footprint uses a 2.2 / b 1.1 / c 2.0 mm (inside the 3.2x2.5 row of the shared land
#     table, GCM32ER71C226ME19-01A DS p.28: a and b at their midpoints; c 2.0, inside 1.8-2.3, midpoint 2.05).
#     The -00B C0G sheets (GCM32D5C3A682GX01-00B DS p.29, GCM32E5C2J223FX03-00B DS p.29) print the same 3.2x2.5 row (a 2.0-2.4,
#     b 1.0-1.2, c 1.8-2.3): no -00B vs -01A difference for the 1210 land row.
# Product URL: the reference sheets print no product page address; the only URL printed is a contact form; datasheet_url
# says so and datasheet_file is the source (open item).

# Open item: X7R qualification text rows not stored: No. 14 Resistance to Soldering Heat ('Capacitance: within the specified
#   initial value', GCM32ER71C226ME19-01A DS p.5) and No. 23 Terminal Strength (DS p.6).
[part]
value           = "GCM32D"                    # series: the catalog values are rows of catalog.csv
manufacturer    = "Murata"
description     = "Chip multilayer ceramic capacitors, X7R (R7) and C0G (5C), 3225M (1210), thickness 2.0 mm (code D), AEC-Q200 (GCM series)"
category        = "capacitor_mlcc"
package         = "3225M (1210)"
kicad_symbol    = "GCM32D.kicad_sym"
kicad_footprint = "GCM32D.kicad_mod"
step            = "GCM32D.step"
datasheet_url   = ""  # open item: the reference sheets print no datasheet URL (only a contact form); use datasheet_file
datasheet_file  = "docs/datasheets/GCM32D5C3A682GX01-00B-EN.pdf"  # C0G reference sheet of GCM32D5C3A682GX01; the per-part rows come from it and from GCM32D5C2J123FX01-00B
datasheet_rev   = "00B"
datasheet_date  = "2026-04"                   # DS p.2 "product specifications in this catalog are as of Apr.13,2026"
series          = "capacitor"
catalog         = "catalog.csv"
catalog_decoder = "murata-gcm"          # lib.check re-decodes every row (lib/catalog.py tables, cross-check only)
tc_param        = { X7R = "tc_x7r", C0G = "tc_c0g" }  # dielectric -> the row holding its temperature characteristic
package_default    = "L"                      # DS p.2 Package table (C0G sheet, 2.0 mm): L = phi180 reel, plastic tape
package_alternates = ["K"]                    # DS p.2 Package table: K = phi330 reel, plastic tape (packaging only)

# Pins: DS p.2 Type & Dimension figure. Non-polarized two-terminal chip capacitor; pin names are the terminal numbers.

[[pin]]
number   = "1"
name     = "1"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

[[pin]]
number   = "2"
name     = "2"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

# Land pattern (footprint, reflow), shared by every 1210 directory. Source: the 1210 X7R reference sheet
# (docs/datasheets/GCM32ER71C226ME19-01A-EN.pdf), DS p.28, "2. Land Dimensions", Table 2 Reflow Soldering Method, row
# 3.2x2.5. The DS labels the dimensions only by letter: neutral names. Inferred meaning, not printed: a = land-to-land gap,
# b = land length, c = land width (as for GCM21). Footprint used: a 2.2 / b 1.1 / c 2.0 mm (c 2.0 is inside the printed 1.8-2.3).

[param.land_a]
name       = "Land pattern dimension a (reflow)"
symbol     = "a"
kind       = "mechanical"
scope      = "na"
min        = 2.0
max        = 2.4
unit       = "mm"
conditions = "Reflow soldering, chip 3.2x2.5, code 32"
cite       = "DS p.28 (GCM32ER71C226ME19-01A), 2. Land Dimensions, Table 2 Reflow Soldering Method, 3.2x2.5, a"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: gap between lands (not printed)."

[param.land_b]
name       = "Land pattern dimension b (reflow)"
symbol     = "b"
kind       = "mechanical"
scope      = "na"
min        = 1.0
max        = 1.2
unit       = "mm"
conditions = "Reflow soldering, chip 3.2x2.5, code 32"
cite       = "DS p.28 (GCM32ER71C226ME19-01A), 2. Land Dimensions, Table 2 Reflow Soldering Method, 3.2x2.5, b"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: land length, outer side (not printed)."

[param.land_c]
name       = "Land pattern dimension c (reflow)"
symbol     = "c"
kind       = "mechanical"
scope      = "na"
min        = 1.8
max        = 2.3
unit       = "mm"
conditions = "Reflow soldering, chip 3.2x2.5, code 32"
cite       = "DS p.28 (GCM32ER71C226ME19-01A), 2. Land Dimensions, Table 2 Reflow Soldering Method, 3.2x2.5, c"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: land width across the chip (not printed)."

# C0G per-part rows, part 1: GCM32D5C3A682GX01 (6800 pF, DC 1000 V, +/-2 %), from its C0G reference sheet
# (docs/datasheets/GCM32D5C3A682GX01-00B-EN.pdf). Keys end in _682_c0g; the C0G suffix marks the dielectric.

# Rated value (DS p.2, Rated Value)

[param.capacitance_ds_682_c0g]
parts = ["GCM32D5C3A682GX01"]
name       = "Capacitance"
symbol     = "C"
kind       = "electrical"
scope      = "25C"
typ        = 6800
unit       = "pF"
conditions = "25 degC, 1.0 +/-0.1 kHz, 1.0 +/-0.2 Vrms (DS p.5, No. 17)"
cite       = "DS p.2, Rated Value, Capacitance (6800pF)"

[param.rated_v_ds_682_c0g]
parts = ["GCM32D5C3A682GX01"]
name       = "Rated voltage (DC)"
kind       = "rec_op"
scope      = "na"
min        = -1000
max        = 1000
unit       = "V"
min_ref    = "2"
max_ref    = "2"
unchecked  = "the generated rated_voltage check applies the catalog rated voltage of the selected part; this per-part row duplicates it (owner: module)"
conditions = "Voltage between pin 1 and pin 2 (non-polarized; either polarity)"
cite       = "DS p.2, Rated Value, Rated Voltage (DC 1000V)"
note       = "DS prints DC 1000V with no MIN/MAX label. Stored symmetric (min -1000, max 1000) because the part is non-polarized: |V(1)-V(2)| <= 1000 V. The wrapper checks the catalog rating (same value for this part), not this row."

[param.tolerance_ds_682_c0g]
parts = ["GCM32D5C3A682GX01"]
name       = "Capacitance tolerance"
kind       = "electrical"
scope      = "na"
min        = -2
max        = 2
unit       = "%"
conditions = ""
cite       = "DS p.2, Rated Value, Capacitance Tolerance (+/-2 %)"
note       = "Printed +/-2 % as a limit: min -2, max 2 (SPEC +/-X rule). The catalog tolerance of this value (catalog.csv) is the export's own printed value."

