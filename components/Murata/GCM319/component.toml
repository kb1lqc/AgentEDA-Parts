[param.tc_c0g]
dielectric = "C0G"
name       = "Temperature characteristic, C0G (EIA)"
symbol     = "TC"
kind       = "electrical"
scope      = "partial"
min        = -30
max        = 30
unit       = "ppm/degC"
conditions = "Ref. temp 25 degC; temp range printed as 25 to 125 degC; coefficient 0 +/-30 ppm/degC"
cite       = "DS p.2 (GCM3195C1H273FA16-01A-EN.pdf), Rated Value, Temp. coeff. or Cap. Change (0+/-30 ppm/degC), Temp. Range (25 to 125 degC)"
note       = "C0G (EIA) temperature coefficient, not a percent-change class. Printed for 25 to 125 degC only. -55 to -10 degC drift is in the Table A rows (capdrift_*_c0g); -10 to 25 degC has no printed number (open item). capacitance_worst_ppm refuses dt outside 0 to 100 degC (docs/SPEC.md, Capacitor series)."

[param.op_temp_c0g]
dielectric = "C0G"
name       = "Operating temperature range"
kind       = "rec_op"
scope      = "na"
min        = -55
max        = 125
unit       = "degC"
conditions = ""
cite       = "DS p.2 (GCM3195C1H273FA16-01A-EN.pdf), Rated Value, Operating Temp. Range (-55 to 125 degC)"
note       = "Read from the C0G reference sheet of this directory's C0G part. lib.catalog refuses an export row whose Operating Temperature is not -55 to 125 degC, so every C0G catalog row uses it."
check_ambient = true

[param.capdrift_m55_c0g]
dielectric = "C0G"
name       = "Capacitance change at -55 degC vs 25 degC (Table A)"
symbol     = "dC"
kind       = "electrical"
scope      = "partial"
min        = -0.24
max        = 0.58
unit       = "%"
conditions = "Reference 25 degC, no bias; measured at -55 degC"
cite       = "DS p.7 (GCM3195C1H273FA16-01A-EN.pdf), Table A Capacitance Change between at Reference Temp. and at each Temp. (%), 5C, -55 degC"
note       = "Printed Max 0.58, Min -0.24: stored as min -0.24, max 0.58 (printed columns). Covers only the -55 degC point."

[param.capdrift_m30_c0g]
dielectric = "C0G"
name       = "Capacitance change at -30 degC vs 25 degC (Table A)"
symbol     = "dC"
kind       = "electrical"
scope      = "partial"
min        = -0.17
max        = 0.4
unit       = "%"
conditions = "Reference 25 degC, no bias; measured at -30 degC"
cite       = "DS p.7 (GCM3195C1H273FA16-01A-EN.pdf), Table A Capacitance Change between at Reference Temp. and at each Temp. (%), 5C, -30 degC"
note       = "Printed Max 0.4, Min -0.17: stored as min -0.17, max 0.4 (printed columns). Covers only the -30 degC point."

[param.capdrift_m10_c0g]
dielectric = "C0G"
name       = "Capacitance change at -10 degC vs 25 degC (Table A)"
symbol     = "dC"
kind       = "electrical"
scope      = "partial"
min        = -0.11
max        = 0.25
unit       = "%"
conditions = "Reference 25 degC, no bias; measured at -10 degC"
cite       = "DS p.7 (GCM3195C1H273FA16-01A-EN.pdf), Table A Capacitance Change between at Reference Temp. and at each Temp. (%), 5C, -10 degC"
note       = "Printed Max 0.25, Min -0.11: stored as min -0.11, max 0.25 (printed columns). Covers only the -10 degC point."

[param.capdrift_limit_c0g]
dielectric = "C0G"
name       = "Capacitance drift limit (temperature characteristics test)"
symbol     = "dC"
kind       = "electrical"
scope      = "na"
unit       = "%"
text       = "Within +/-0.2 % or +/-0.05 pF, whichever is larger"
conditions = "Temperature characteristics test, less than 1.0 Vrms; capacitance at steps 1, 3, 5 compared with step 3"
cite       = "DS p.6 (GCM3195C1H273FA16-01A-EN.pdf), Specifications and Test Methods, No. 25 Temperature Characteristics, Capacitance Drift"
note       = "Text row: the limit is the larger of a percentage and an absolute value. Not stored as numbers."

