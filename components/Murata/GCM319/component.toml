# Murata GCM319 series: 3216M (1206) C0G (5C), thickness 0.85 mm (code 9) capacitance series (docs/SPEC.md, "Capacitor series"). One directory per Murata
# size+thickness code (the symbol, footprint and STEP are per directory). Every orderable value is a row of catalog.csv,
# generated from Murata's product-list export by
#   python3 -B -m lib.catalog murata-gcm docs/vendor/Murata_GCM/series-product-list.csv components/Murata/GCM319 --dielectrics X7R,C0G
# and cited per row to that export (a manufacturer export, not a datasheet). Lifecycle, revision currency, errata and PCN:
# not checked (no web access). Row scopes: rows without a restriction apply to every part; rows with dielectric = "X7R" /
# "C0G" to every part of that dielectric; rows with parts = [...] only to the catalog values named there.
# Shared rows: the land rows (land_*_020, land_*_030) from the -01A 1206 X7R sheet, DS p.28 (same rows as the GCM31M and GCM319
# -01A sheets, p.27). Footprint: a 1.9 / b 1.1 / c 1.7 mm, chosen to fit both printed rows (a 1.9 is inside 1.8-2.0 and
# 1.9-2.1; b 1.1 is inside 0.9-1.2 and 1.0-1.3; c 1.7 is inside 1.5-1.7 and 1.7-1.9).
#
# Part decode (DS p.2, example GCM3195C1H273FA16-01A): GCM series, 31 = 3216M (1206) 3.2 x 1.6, 9 = T 0.85 mm (thickness
# code 9), 5C = C0G (EIA), 1H = DC 50 V, 273 = 27000 pF, F = +/-1 %, A16 = individual specification (Murata control code),
# D = package (paper tape). The catalog holds C0G only (44 rows; the export has no X7R 0.85 mm part).
# Per-part rows: GCM3195C1H273FA16 (27 nF, +/-1 %, DC 50 V), reference sheet docs/datasheets/GCM3195C1H273FA16-01A-EN.pdf,
# "product specifications as of Apr.10,2026". Other catalog values have no per-part datasheet rows (open item).
# Dielectric rows: the C0G rows come from this directory's own C0G sheet (C0G has no X7R row in this catalog).
# Package letters (DS p.2 Package table, this sheet, PAPER tape): D = phi180 reel, paper tape W8P4, 4000 pcs/reel;
#   J = phi330 reel, paper tape W8P4, 10000 pcs/reel. Confirmed on this sheet (p.2). MPN = catalog value + D; J is the same part.
# Open items (DS gives no numbers, so nothing is stored):
#   - Aging (capacitance decrease with time): not read on this sheet; not stored.
#   - Operating temperature range is a single row (-55 to 125 degC); no derating curve is printed.
#   - Stress rows printed as text (within the specified initial value; 95 % terminations; 15 N beam) are stored as text.
#   - Capacitance drift between -10 and 25 degC has no printed number (C0G Table A covers -55 to -10 only).
#   - Thickness: the export prints 0.85mm +/-0.1mm; the sheet prints 0.85+/-0.1 (agrees).
#   - Land pattern: the sheet's own land table (p.27) agrees with the 1206 X7R sheet (p.28); not confirmed against a -00B sheet
#     (no -00B 0.85 mm sheet exists).
#   - STEP: docs/vendor/GCM319/CAP_GCM_3p35x1p75x0p95_MUR.step (KiCad agent). The footprint and STEP are not checked here.
#   - Product URL: the reference sheet prints no product page address; datasheet_url says so (open item).

[part]
value           = "GCM319"                    # series: the catalog values are rows of catalog.csv
manufacturer    = "Murata"
description     = "Chip multilayer ceramic capacitors, C0G (5C), 3216M (1206), thickness 0.85 mm (code 9), AEC-Q200 (GCM series)"
category        = "capacitor_mlcc"
package         = "3216M (1206)"
kicad_symbol    = "GCM319.kicad_sym"
kicad_footprint = "GCM319.kicad_mod"
step            = "GCM319.step"
datasheet_url   = ""  # open item: the reference sheet prints no datasheet URL (only a contact form); use datasheet_file
datasheet_file  = "docs/datasheets/GCM3195C1H273FA16-01A-EN.pdf"
datasheet_rev   = "01A"
datasheet_date  = "2026-04"
series          = "capacitor"
catalog         = "catalog.csv"
catalog_decoder = "murata-gcm"          # lib.check re-decodes every row (lib/catalog.py tables, cross-check only)
tc_param        = { C0G = "tc_c0g" }  # dielectric -> the row holding its temperature characteristic
package_default    = "D"
package_alternates = ["J"]

# Pins: DS p.2 Type & Dimension figure. Non-polarized two-terminal chip capacitor; pin names are the terminal numbers.

[[pin]]
number   = "1"
name     = "1"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

[[pin]]
number   = "2"
name     = "2"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

