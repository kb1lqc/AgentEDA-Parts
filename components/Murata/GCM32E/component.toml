# Murata GCM32E series: 3225M (1210) thickness code E (T 2.5 mm) X7R (R7) and C0G (5C) MLCCs, a capacitor series
# (docs/SPEC.md, "Capacitor series"). One directory per Murata size+thickness code (the symbol, footprint and STEP are per
# directory). Every orderable value is a row of catalog.csv, generated from Murata's product-list export by
#   python3 -m lib.catalog murata-gcm docs/vendor/Murata_GCM/series-product-list.csv components/Murata/GCM32E --dielectrics X7R,C0G
# and cited per row to that export (a manufacturer export, not a datasheet). X7R and C0G rows are listed; each
# dielectric has its temperature-characteristic row (tc_x7r, tc_c0g) and its operating-temperature row (op_temp_*).
# Row scopes: rows without a restriction apply to every part; rows with dielectric = "X7R" / "C0G" to every part of that
# dielectric; rows with parts = [...] only to the catalog values named there.
# The per-part rows come from the two reference sheets of this directory: the C0G sheet GCM32E5C2J223FX03 (22000 pF, DC 630 V,
# +/-1 %), docs/datasheets/GCM32E5C2J223FX03-00B-EN.pdf, and the X7R sheet GCM32ER71C226ME19 (22 uF, DC 16 V, +/-20 %),
# docs/datasheets/GCM32ER71C226ME19-01A-EN.pdf (Murata reference sheets, "product specifications as of Apr.13,2026").
# The other catalog values have no per-part datasheet rows (open item). Dielectric rows: the C0G rows come from the C0G
# sheet GCM32E5C2J223FX03 (DS p.2, p.6-7); the X7R rows come from the X7R sheet GCM32ER71C226ME19-01A (DS p.2).
# Lifecycle, revision currency, errata and PCN: not checked (no web access).
#
# Part decode (DS p.2, MURATA Part No. System, example GCM32E5C2J223FX03-00B): GCM series, 32 = L x W 3225M (1210) 3.2 x 2.5,
# E = T 2.5 mm (thickness code E), 5C = C0G (EIA), 2J = DC 630 V, 223 = 22000 pF, F = +/-1 %, X03 = individual specification
# (Murata control code), L/K = package (see below). R7 = X7R (EIA); the X7R example is GCM32ER71C226ME19 (1C = DC 16 V, 226 = 22 uF,
# M = +/-20 %, E19 = individual specification).
# Package letters (DS p.2 Package table, C0G and X7R sheets, thickness 2.5 mm): L = phi180 reel, plastic tape W8P4, 1000 pcs/reel;
#   K = phi330 reel, plastic tape W8P4, 4000 pcs/reel. Both sheets print the same letters and quantities (X7R DS p.2 and p.9).
#   MPN = catalog value + package letter; default letter L; K is the same part in other packaging.
# The decode tables in lib/catalog.py are a cross-check of the export only ("Not a DS rule"): the reference sheets decode
# just their own example numbers.
#
# Open items (DS gives no numbers, so nothing is stored):
#   - DC voltage characteristic (X7R capacitance loss under DC bias): the DS figure is an example for another sample
#     (0.1 uF, 50 VDC, DS p.14 section 5 of the X7R sheet); no number is printed, so nothing is stored as a bound (see dc_bias).
#     capacitance_worst_pct/_ppm exclude it.
#   - AC voltage characteristic: text only. Self-heating (below 20 degC at 25 degC ambient, rated voltage below 100 VDC) and the
#     AC peak rule are stored (self_heating, ac_peak); the self-heating row applies to the 16 V X7R part only.
#   - Aging (capacitance decrease with time): DS p.15 (X7R sheet, section 6) and DS p.16 (C0G sheet), text only; no rate printed.
#   - Operating temperature range is a single row (-55 to 125 degC); no derating curve is printed.
#   - L/W/T tolerance class: the X7R sheet is L 3.2+/-0.3, W 2.5+/-0.2, T 2.5+/-0.2; the C0G sheet is 3.2/2.5/2.5 +/-0.15. The
#     export's own class of each row is in catalog.csv. The per-part size rows apply to each reference part only (open item).
#   - Land pattern: footprint uses a 2.2 / b 1.1 / c 2.0 mm (inside the 3.2x2.5 row of the shared land table,
#     GCM32ER71C226ME19-01A DS p.28). a and b at midpoints; c 2.0 is inside 1.8-2.3 (midpoint 2.05).
#     The -00B C0G sheets (GCM32E5C2J223FX03-00B DS p.29; GCM32D5C3A682GX01-00B DS p.29) print the same 3.2x2.5 row (a 2.0-2.4,
#     b 1.0-1.2, c 1.8-2.3): no -00B vs -01A difference for the 1210 land row.
# Product URL: the reference sheets print no product page address; the only URL printed is a contact form; datasheet_url
# says so and datasheet_file is the source (open item).

# Open item: X7R qualification text rows not stored: No. 14 Resistance to Soldering Heat ('Capacitance: within the specified
#   initial value', GCM32ER71C226ME19-01A DS p.5) and No. 23 Terminal Strength (DS p.6).
[part]
value           = "GCM32E"                    # series: the catalog values are rows of catalog.csv
manufacturer    = "Murata"
description     = "Chip multilayer ceramic capacitors, X7R (R7) and C0G (5C), 3225M (1210), thickness 2.5 mm (code E), AEC-Q200 (GCM series)"
category        = "capacitor_mlcc"
package         = "3225M (1210)"
kicad_symbol    = "GCM32E.kicad_sym"
kicad_footprint = "GCM32E.kicad_mod"
step            = "GCM32E.step"
datasheet_url   = ""  # open item: the reference sheets print no datasheet URL (only a contact form); use datasheet_file
datasheet_file  = "docs/datasheets/GCM32ER71C226ME19-01A-EN.pdf"  # X7R reference sheet of GCM32ER71C226ME19; its per-part rows and the X7R dielectric rows come from it (the C0G per-part rows come from GCM32E5C2J223FX03-00B)
datasheet_rev   = "01A"
datasheet_date  = "2026-04"                   # DS p.2 "product specifications in this catalog are as of Apr.13,2026"
series          = "capacitor"
catalog         = "catalog.csv"
catalog_decoder = "murata-gcm"          # lib.check re-decodes every row (lib/catalog.py tables, cross-check only)
tc_param        = { X7R = "tc_x7r", C0G = "tc_c0g" }  # dielectric -> the row holding its temperature characteristic
package_default    = "L"                      # DS p.2 Package table (X7R and C0G sheets, 2.5 mm): L = phi180 reel, plastic tape
package_alternates = ["K"]                    # DS p.2 Package table: K = phi330 reel, plastic tape (packaging only)

# Pins: DS p.2 Type & Dimension figure. Non-polarized two-terminal chip capacitor; pin names are the terminal numbers.

[[pin]]
number   = "1"
name     = "1"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

[[pin]]
number   = "2"
name     = "2"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

# Land pattern (footprint, reflow), shared by every 1210 directory. Source: the 1210 X7R reference sheet
# (docs/datasheets/GCM32ER71C226ME19-01A-EN.pdf), DS p.28, "2. Land Dimensions", Table 2 Reflow Soldering Method, row
# 3.2x2.5. The DS labels the dimensions only by letter: neutral names. Inferred meaning, not printed: a = land-to-land gap,
# b = land length, c = land width (as for GCM21). Footprint used: a 2.2 / b 1.1 / c 2.0 mm (c 2.0 is inside the printed 1.8-2.3).

[param.land_a]
name       = "Land pattern dimension a (reflow)"
symbol     = "a"
kind       = "mechanical"
scope      = "na"
min        = 2.0
max        = 2.4
unit       = "mm"
conditions = "Reflow soldering, chip 3.2x2.5, code 32"
cite       = "DS p.28 (GCM32ER71C226ME19-01A-EN.pdf), 2. Land Dimensions, Table 2 Reflow Soldering Method, 3.2x2.5, a"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: gap between lands (not printed)."

[param.land_b]
name       = "Land pattern dimension b (reflow)"
symbol     = "b"
kind       = "mechanical"
scope      = "na"
min        = 1.0
max        = 1.2
unit       = "mm"
conditions = "Reflow soldering, chip 3.2x2.5, code 32"
cite       = "DS p.28 (GCM32ER71C226ME19-01A-EN.pdf), 2. Land Dimensions, Table 2 Reflow Soldering Method, 3.2x2.5, b"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: land length, outer side (not printed)."

[param.land_c]
name       = "Land pattern dimension c (reflow)"
symbol     = "c"
kind       = "mechanical"
scope      = "na"
min        = 1.8
max        = 2.3
unit       = "mm"
conditions = "Reflow soldering, chip 3.2x2.5, code 32"
cite       = "DS p.28 (GCM32ER71C226ME19-01A-EN.pdf), 2. Land Dimensions, Table 2 Reflow Soldering Method, 3.2x2.5, c"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: land width across the chip (not printed)."

# C0G per-part rows: GCM32E5C2J223FX03 (22000 pF, DC 630 V, +/-1 %), from its C0G reference sheet
# (docs/datasheets/GCM32E5C2J223FX03-00B-EN.pdf). Keys end in _c0g; the C0G suffix marks the dielectric.

# Rated value (DS p.2, Rated Value)

[param.capacitance_ds_c0g]
parts = ["GCM32E5C2J223FX03"]
name       = "Capacitance"
symbol     = "C"
kind       = "electrical"
scope      = "25C"
typ        = 22000
unit       = "pF"
conditions = "25 degC, 1.0 +/-0.1 kHz, 1.0 +/-0.2 Vrms (DS p.5, No. 17)"
cite       = "DS p.2 (GCM32E5C2J223FX03-00B-EN.pdf), Rated Value, Capacitance (22000pF)"

[param.rated_v_ds_c0g]
parts = ["GCM32E5C2J223FX03"]
name       = "Rated voltage (DC)"
kind       = "rec_op"
scope      = "na"
min        = -630
max        = 630
unit       = "V"
min_ref    = "2"
max_ref    = "2"
unchecked  = "the generated rated_voltage check applies the catalog rated voltage of the selected part; this per-part row duplicates it (owner: module)"
conditions = "Voltage between pin 1 and pin 2 (non-polarized; either polarity)"
cite       = "DS p.2 (GCM32E5C2J223FX03-00B-EN.pdf), Rated Value, Rated Voltage (DC 630V)"
note       = "DS prints DC 630V with no MIN/MAX label. Stored symmetric (min -630, max 630) because the part is non-polarized. The wrapper checks the catalog rating, not this row."

[param.tolerance_ds_c0g]
parts = ["GCM32E5C2J223FX03"]
name       = "Capacitance tolerance"
kind       = "electrical"
scope      = "na"
min        = -1
max        = 1
unit       = "%"
conditions = ""
cite       = "DS p.2 (GCM32E5C2J223FX03-00B-EN.pdf), Rated Value, Capacitance Tolerance (+/-1 %)"
note       = "Printed +/-1 % as a limit: min -1, max 1 (SPEC +/-X rule). The catalog tolerance of this value (catalog.csv) is the export's own printed value."

# Type & Dimension (DS p.2, C0G sheet): L 3.2+/-0.15, W 2.5+/-0.15, T 2.5+/-0.15, e 0.3 min., g 1.5 min.

