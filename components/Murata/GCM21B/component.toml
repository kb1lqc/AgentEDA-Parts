max        = 0.8
unit       = "mm"
conditions = "Reflow soldering, chip 2.0x1.25 (+/-0.15), code 21"
cite       = "DS p.27 (GCM21BR72A104KA37-01A), 2. Land Dimensions, Table 2 Reflow Soldering Method, 2.0x1.25 (+/-0.15), b"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: land length, outer side (not printed)."

[param.land_c_015]
name       = "Land pattern dimension c (reflow)"
