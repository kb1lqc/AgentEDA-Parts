kind       = "electrical"
scope      = "partial"
min        = -0.17
max        = 0.4
unit       = "%"
conditions = "Reference 25 degC, no bias; measured at -30 degC"
cite       = "DS p.7 (C0G sheet of GCM21A5C2E101FX01), Table A Capacitance Change between at Reference Temp. and at each Temp. (%), 5C, -30 degC"
note       = "Printed Max 0.4, Min -0.17: stored as min -0.17, max 0.4 (printed columns). Covers only the -30 degC point."

[param.capdrift_m10_c0g]
dielectric = "C0G"
name       = "Capacitance change at -10 degC vs 25 degC (Table A)"
symbol     = "dC"
kind       = "electrical"
scope      = "partial"
min        = -0.11
max        = 0.25
