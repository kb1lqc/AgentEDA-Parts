# Murata GCM21B series: 2012M (0805) thickness code B (T 1.25 mm) X7R (R7) and C0G (5C) MLCCs, a capacitor series
# (docs/SPEC.md, "Capacitor series"). One directory per Murata size+thickness code (the symbol, footprint and STEP are per
# directory). Every orderable value is a row of catalog.csv, generated from Murata's product-list export by
#   python3 -m lib.catalog murata-gcm docs/vendor/Murata_GCM/gcm-series-product-list-2026-11-14.csv components/Murata/GCM21B --dielectrics X7R,C0G
# and cited per row to that export (a manufacturer export, not a datasheet). X7R and C0G rows are listed; each
# dielectric has its temperature-characteristic row (tc_x7r, tc_c0g) and its operating-temperature row (op_temp_*).
# Row scopes: rows without a restriction apply to every part; rows with dielectric = "X7R" / "C0G" to every part of that
# dielectric; rows with parts = [...] only to the catalog values named there.
# The per-part rows come from the one reference sheet this directory has for X7R: GCM21BR72A104KA37 (0.1 uF, +/-10 %,
# DC 100 V, T 1.25 mm), docs/datasheets/GCM21BR72A104KA37-01A-EN.pdf (Murata reference sheet, "product specifications as
# of Apr.10,2026"). The other catalog values have no per-part datasheet rows (open item).
# Shared rows: the land rows (land_*_015, land_*_020) come from the newer GCM21B X7R reference sheet, DS p.27
# (shared by every 0805 directory). Dielectric rows: the C0G rows come from the C0G sheet of GCM21A, the X7R rows from the X7R
# sheet of GCM21B; both dielectrics are listed in both directories.
# Lifecycle, revision currency, errata and PCN: not checked (no web access).
#
# Part decode (DS p.2, MURATA Part No. System, example GCM21BR72A104KA37-01A): GCM series, 21 = L x W 2012M (0805) 2.0 x 1.25,
# B = T 1.25 mm (thickness code B), R7 = X7R (EIA), 2A = DC 100 V, 104 = 0.1 uF, K = +/-10 %, A37 = individual specification
# (Murata control code), L/K = package (see below).
# Package letters (DS p.2 Package table, X7R sheet, thickness 1.25 mm): L = phi180 reel, plastic tape W8P4, 3000 pcs/reel;
#   K = phi330 reel, plastic tape W8P4, 10000 pcs/reel. The package table is taken from this one sheet (1.25 mm) and assumed
#   for both dielectrics of thickness code B (open item: the C0G 1.25 mm parts have no C0G 1.25 mm sheet to confirm it).
#   MPN = catalog value + package letter; default letter L; K is the same part in other packaging.
# The decode tables in lib/catalog.py are a cross-check of the export only ("Not a DS rule"): the reference sheet decodes
# just its own example number.
#
# Open items (DS gives no numbers, so nothing is stored):
#   - DC voltage characteristic (X7R capacitance loss under DC bias): the DS figure is an example for another sample
#     (0.1 uF, 50 VDC, DS p.13 section 5); no number is printed, so nothing is stored as a bound (see the dc_bias row).
#     capacitance_worst_pct/_ppm exclude it.
#   - AC voltage characteristic: text only. Self-heating (< 20 degC) and the AC peak rule are stored (self_heating, ac_peak).
#   - Aging (capacitance decrease with time): DS p.14, section 6, text only; no rate printed.
#   - Operating temperature range is a single row (-55 to 125 degC); no derating curve is printed.
#   - L/W/T tolerance class: the export has 92 rows at 2.0 +/-0.15 x 1.25 +/-0.15 x 1.25 +/-0.15 (this sheet's class) and 45 rows
#     at 2.0 +/-0.2 x 1.25 +/-0.2 x 1.25 +/-0.2 (max 1.45). The +/-0.2 class has no sheet; the per-part size rows follow the
#     reference part (+/-0.15) only (open item).
#   - Land pattern: footprint uses a 1.2 / b 0.7 / c 1.3 mm, chosen to fit both rows of GCM21BR72A104KA37-01A DS p.27
#     (2.0x1.25 +/-0.15 and +/-0.20). The older GCM21A5C2E101FX01-00B sheet (DS p.29) prints a different single row
#     (a 1.0-1.2, b 0.6-0.7, c 0.8-1.1), not used (open item).
# Product URL: the reference sheet prints no product page address; the only URL printed is a contact form; datasheet_url
# says so and datasheet_file is the source (open item).

[part]
value           = "GCM21B"                    # series: the catalog values are rows of catalog.csv
manufacturer    = "Murata"
description     = "Chip multilayer ceramic capacitors, X7R (R7) and C0G (5C), 2012M (0805), thickness 1.25 mm (code B), AEC-Q200 (GCM series)"
category        = "capacitor_mlcc"
package         = "2012M (0805)"
kicad_symbol    = "GCM21B.kicad_sym"
kicad_footprint = "GCM21B.kicad_mod"
step            = "GCM21B.step"
datasheet_url   = ""  # open item: the reference sheet prints no datasheet URL (only a contact form); use datasheet_file
datasheet_file  = "docs/datasheets/GCM21BR72A104KA37-01A-EN.pdf"  # X7R reference sheet of GCM21BR72A104KA37; the per-part rows come from it
datasheet_rev   = "01A"
datasheet_date  = "2026-04"                   # DS p.2 "product specifications in this catalog are as of Apr.10,2026"
series          = "capacitor"
catalog         = "catalog.csv"
catalog_decoder = "murata-gcm"          # lib.check re-decodes every row (lib/catalog.py tables, cross-check only)
tc_param        = { X7R = "tc_x7r", C0G = "tc_c0g" }  # dielectric -> the row holding its temperature characteristic
package_default    = "L"                      # DS p.2 Package table (X7R sheet, 1.25 mm): L = phi180 reel, plastic tape
package_alternates = ["K"]                    # DS p.2 Package table: K = phi330 reel, plastic tape (packaging only)

# Pins: DS p.2 Type & Dimension figure. Non-polarized two-terminal chip capacitor; pin names are the terminal numbers.

[[pin]]
number   = "1"
name     = "1"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

[[pin]]
number   = "2"
name     = "2"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

# Land pattern (footprint, reflow), shared by every 0805 directory. Source: the newer GCM21B X7R reference sheet
# (docs/datasheets/GCM21BR72A104KA37-01A-EN.pdf), DS p.27, "2. Land Dimensions", Table 2 Reflow Soldering Method, row
# 2.0x1.25 (both tolerance rows). The DS labels the dimensions only by letter: neutral names. Inferred meaning, not
# printed: a = land-to-land gap, b = land length, c = land width (as for GCM188). Footprint used: a 1.2 / b 0.7 / c 1.3 mm,
# chosen to fit both rows (a 1.2 is inside 1.0-1.4 and 1.2; b 0.7 is inside 0.6-0.8; c 1.3 is inside 1.2-1.4).
# The older GCM21A5C2E101FX01-00B sheet (DS p.29) prints a different single row (a 1.0-1.2, b 0.6-0.7, c 0.8-1.1): open
# item, not used.

[param.land_a_015]
name       = "Land pattern dimension a (reflow)"
symbol     = "a"
kind       = "mechanical"
scope      = "na"
min        = 1.2
max        = 1.2
unit       = "mm"
conditions = "Reflow soldering, chip 2.0x1.25 (+/-0.15), code 21"
cite       = "DS p.27 (GCM21BR72A104KA37-01A), 2. Land Dimensions, Table 2 Reflow Soldering Method, 2.0x1.25 (+/-0.15), a"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: gap between lands (not printed). Row for the +/-0.15 chip; the +/-0.20 row is land_a_020."

[param.land_b_015]
name       = "Land pattern dimension b (reflow)"
