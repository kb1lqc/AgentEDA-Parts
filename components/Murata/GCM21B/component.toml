note       = "Printed Max 0.25, Min -0.11: stored as min -0.11, max 0.25 (printed columns). Covers only the -10 degC point."

[param.capdrift_limit_c0g]
dielectric = "C0G"
name       = "Capacitance drift limit (temperature characteristics test)"
symbol     = "dC"
kind       = "electrical"
scope      = "na"
text       = "Within +/-0.2 % or +/-0.05 pF, whichever is larger"
unit       = "%"
conditions = "Temperature characteristics test, 1.0 Vrms max; capacitance at steps 1, 3, 5 compared with step 3"
