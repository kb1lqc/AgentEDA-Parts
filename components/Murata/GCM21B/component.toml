# X7R dielectric rows (dielectric X7R, Murata public code R7 / X7R (EIA)). Source: the X7R reference sheet (DS p.2, p.12, p.13).

[param.tc_x7r]
dielectric = "X7R"
name       = "Temperature characteristic, R7 (X7R)"
symbol     = "TC"
kind       = "electrical"
scope      = "full"
min        = -15
max        = 15
unit       = "%"
conditions = "Ref. temp 25 degC; temp range -55 to 125 degC; capacitance change over temperature"
cite       = "DS p.2, Rated Value, Temp. coeff. or Cap. Change (-15 to 15 %)"
note       = "Public STD code X7R (EIA). Capacitance change over temperature, not a DC-bias or aging limit. Read from the reference sheet of the one part this directory has; used for every X7R catalog row (open item: confirm for each other X7R part)."

[param.op_temp_x7r]
dielectric = "X7R"
name       = "Operating temperature range"
kind       = "rec_op"
scope      = "na"
min        = -55
max        = 125
unit       = "degC"
conditions = ""
cite       = "DS p.2, Rated Value, Operating Temp. Range (-55 to 125 degC)"
check_ambient = true
note       = "Read from the X7R reference sheet of GCM21BR72A104KA37. lib.catalog refuses an export row whose Operating Temperature is not -55 to 125 degC, so every X7R catalog row uses it."

[param.self_heating]
parts = ["GCM21BR72A104KA37"]
name       = "Self-heating of the capacitor body (AC or pulse load)"
kind       = "rec_op"
scope      = "na"
text       = "Below 20 degC self-heating at 25 degC ambient, for rated voltages below 100 VDC only (no limit printed for 100 VDC)"
unit       = "degC"
conditions = "Measured at 25 degC ambient; applies to rated voltage below 100 VDC"
cite       = "DS p.13, Rating 4. Type of Applied Voltage and Self-heating Temperature, '< Applicable to Rated Voltage of less than 100VDC >'"
unchecked  = "depends on AC/pulse current, not a DC net voltage; the printed limit does not apply to this 100 VDC part; owner: module"
note       = "The DS limit is printed for rated voltages below 100 VDC. This part is 100 VDC, so no self-heating limit is stored (open item)."

[param.dc_bias]
parts = ["GCM21BR72A104KA37"]
name       = "Capacitance change with DC bias"
kind       = "electrical"
scope      = "na"
text       = "Not specified: the sheet shows only an example curve"
unit       = ""
conditions = "DC voltage applied"
cite       = "DS p.13, Rating 5. DC Voltage and AC Voltage Characteristic (example figure)"
note       = "X7R loses capacitance under DC bias; the DS example curve (0.1 uF, 50 VDC sample) shows a large loss approaching rated voltage; it is an example, not a rating for this part. capacitance_worst_pct/_ppm exclude it: do not use capacitance_worst_pct as an in-circuit minimum. The DS also requires the AC/pulse zero-to-peak voltage to stay within the rated DC voltage; the Zener check is DC steady state only."

[param.ac_peak]
parts = ["GCM21BR72A104KA37"]
name       = "AC or pulse voltage: peak-to-peak (and zero-to-peak with DC) within the rated DC voltage"
kind       = "rec_op"
scope      = "na"
text       = "Vp-p <= rated DC voltage; AC superimposed on DC: zero-to-peak <= rated DC voltage"
unit       = ""
conditions = "AC or pulse voltage applied"
cite       = "DS p.12, Rating 3. Applied Voltage, 1-1 (1)"
unchecked  = "AC/pulse waveform is not modelled by the DC net-voltage check; owner: module"

# C0G dielectric rows of this directory (the C0G rows are shared with GCM21A; they are listed here so that both
# dielectrics are present in every 0805 directory). Source: the C0G reference sheet of GCM21A5C2E101FX01 (DS p.2, p.5-7).

[param.tc_c0g]
dielectric = "C0G"
name       = "Temperature characteristic, C0G (EIA)"
symbol     = "TC"
kind       = "electrical"
scope      = "partial"
min        = -30
max        = 30
unit       = "ppm/degC"
conditions = "Ref. temp 25 degC; temp range printed as 25 to 125 degC; coefficient 0 +/-30 ppm/degC"
cite       = "DS p.2 (C0G sheet of GCM21A5C2E101FX01), Rated Value, Temp. coeff. or Cap. Change (0+/-30 ppm/degC), Temp. Range (25 to 125 degC)"
note       = "Public STD code C0G (EIA). A temperature coefficient, not a percent-change class. The DS prints the range 25 to 125 degC only: no coefficient is printed below 25 degC. The -55 to -10 degC capacitance drift is in the Table A rows (capdrift_*_c0g); the -10 to 25 degC segment has no printed number (open item). capacitance_worst_ppm requires dt and refuses values outside 0 to 100 degC (docs/SPEC.md, Capacitor series)."

[param.op_temp_c0g]
dielectric = "C0G"
name       = "Operating temperature range"
kind       = "rec_op"
scope      = "na"
min        = -55
max        = 125
unit       = "degC"
conditions = ""
cite       = "DS p.2 (C0G sheet of GCM21A5C2E101FX01), Rated Value, Operating Temp. Range (-55 to 125 degC)"
check_ambient = true
note       = "Read from the C0G reference sheet of GCM21A5C2E101FX01. lib.catalog refuses an export row whose Operating Temperature is not -55 to 125 degC, so every C0G catalog row uses it."

# Table A (DS p.7 of the C0G sheet): capacitance change between the reference temperature (25 degC) and each stated temperature, 5C.

[param.capdrift_m55_c0g]
dielectric = "C0G"
name       = "Capacitance change at -55 degC vs 25 degC (Table A)"
symbol     = "dC"
kind       = "electrical"
scope      = "partial"
min        = -0.24
max        = 0.58
unit       = "%"
conditions = "Reference 25 degC, no bias; measured at -55 degC"
cite       = "DS p.7 (C0G sheet of GCM21A5C2E101FX01), Table A Capacitance Change between at Reference Temp. and at each Temp. (%), 5C, -55 degC"
note       = "Printed Max 0.58, Min -0.24: stored as min -0.24, max 0.58 (printed columns). Covers only the -55 degC point."

[param.capdrift_m30_c0g]
dielectric = "C0G"
name       = "Capacitance change at -30 degC vs 25 degC (Table A)"
