# GCM188 family variants. One variant so far: GCM188R71H104KA57 (1608M, X7R R7, 0.1 uF, DC 50 V, +/-10 %).
# Source: docs/datasheets/GCM188R71H104KA57-01A-EN.pdf, product specifications as of Apr.8,2026 (DS p.2 is the decode).
#
# Part decode (DS p.2, MURATA Part No. System, example GCM188R71H104KA57D):
#   GCM series, 18 = L x W 1608M (0603) 1.6 x 0.8, 8 = T 0.8 mm, R7 = X7R (EIA) temperature characteristic, 1H = DC 50 V,
#   104 = 0.1 uF, K = +/-10 %, A57 = individual specification (Murata control code), D = package.
# Package letters (DS p.2 Package table): D = phi180 reel, paper tape W8P4, 4000 pcs/reel; W = phi180, W8P2, 8000 pcs/reel;
#   J = phi330, W8P4, 10000 pcs/reel; V = phi330, W8P2, 30000 pcs/reel.
#   mpn = the D package (the example package in the decode); alternates = the other package letters (packaging only).
#   Mounting method (DS p.2): Flow, Reflow.
#
# Shared rows (component.toml): L, W, R7 temperature characteristic, operating temperature range.
# Rows below are value-specific: capacitance, rated voltage, tolerance, T, e, g, and the Specifications and Test
# Methods limits (pp.3-6). Stress-test rows are limits after the stated stress (scope "na"); initial rows at 25 degC are
# scope "25C" (or "na" where the DS states a single other temperature).
# Test voltages (1.3 V DC with 6.8 kohm, 200 % of rated for the operating life, 250 % voltage proof, 1.0 Vrms
# measurement) are test conditions, not limits: quoted in conditions and not stored as rows.
# IR (insulation resistance) limits are printed in ohm*F ("More than 500 Ohm.F"). The loader has no unit for the product
# ohm*F, so IR rows are text rows with the printed number in the text. This needs a SPEC unit to check numerically.
# Beam load and terminal strength are printed in N, which the loader does not know: stored as text rows.
# DS p.6 gives IR "More than 500 ohm.F" for the terminal strength test (row 23) and "More than 500" for rows 11 to 15,
# 22 (board flex) on p.5-6. Each is stored as its own row below, with its cite.

[variant."GCM188R71H104KA57"]
mpn         = "GCM188R71H104KA57D"
alternates  = ["GCM188R71H104KA57W", "GCM188R71H104KA57J", "GCM188R71H104KA57V"]
temp_grade  = "-55 to 125 degC"
description = "Chip multilayer ceramic capacitor, X7R (R7), 1608M (0603), 0.1 uF, DC 50 V, +/-10 %, AEC-Q200"
datasheet_file = "docs/datasheets/GCM188R71H104KA57-01A-EN.pdf"

# Rated value (DS p.2, Rated Value)

[variant."GCM188R71H104KA57".param.capacitance]
