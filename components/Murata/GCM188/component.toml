# Murata GCM188 series: 1608M (0603) X7R (R7) and C0G (5C) MLCCs, a capacitor series (docs/SPEC.md, "Capacitor series").
# One directory per Murata size+thickness code (the symbol, footprint and STEP are per directory). Every orderable value
# is a row of catalog.csv, generated from Murata's product-list export by
#   python3 -m lib.catalog murata-gcm docs/vendor/Murata_GCM/gcm-series-product-list-2026-11-14.csv components/Murata/GCM188 --dielectrics X7R,C0G
# and cited per row to that export (a manufacturer export, not a datasheet). X7R and C0G rows are listed; each
# dielectric has its temperature-characteristic row (tc_x7r, tc_c0g) and its operating-temperature row (op_temp_*).
# Row scopes: rows without a restriction apply to every part; rows with dielectric = "X7R" to every X7R part; rows with
# parts = [...] only to the catalog values named there. The part-restricted rows come from the two reference sheets this
# directory has: GCM188R71H104KA57 (X7R, rows without suffix) and GCM1885C1H101GA16 (C0G, rows with suffix _c0g); the
# other catalog parts have no per-part datasheet rows (open item).
# Sources of the per-part rows: docs/datasheets/GCM188R71H104KA57-01A-EN.pdf (Murata reference sheet, "product specifications as of Apr.8,2026")
# and docs/datasheets/GCM1885C1H101GA16-01A-EN.pdf (Murata reference sheet, "product specifications as of Apr.7,2026").
# Lifecycle, revision currency, errata and PCN: not checked (no web access).
#
# Part decode (DS p.2, MURATA Part No. System, example GCM188R71H104KA57D): GCM series, 18 = L x W 1608M (0603) 1.6 x 0.8, 8 = T 0.8 mm, R7 = X7R (EIA), 1H = DC 50 V, 104 = 0.1 uF, K = +/-10 %, A57 = individual specification (Murata control code), D = package.
# Package letters (DS p.2 Package table): D = phi180 reel, paper tape W8P4, 4000 pcs/reel; W = phi180, W8P2, 8000 pcs/reel; J = phi330, W8P4, 10000 pcs/reel; V = phi330, W8P2, 30000 pcs/reel.
#   MPN = catalog value + package letter; default letter D (the example package); the others are the same part in other packaging.
# The decode tables in lib/catalog.py are a cross-check of the export only ("Not a DS rule"): the reference sheet decodes
# just its own example number.
#
# Open items (DS gives no numbers, so nothing is stored):
#   - DC voltage characteristic (X7R capacitance loss under DC bias): the DS figure is an example for another sample
#     (R(R1)); no number is printed, so nothing is stored as a bound (see the dc_bias row). capacitance_worst_pct/_ppm exclude it.
#   - AC voltage characteristic: text only. Self-heating (< 20 degC) and the AC peak rule are stored (self_heating, ac_peak).
#   - Aging (capacitance decrease with time): DS p.14, section 6, figure "Example of Change Over Time (Aging
#     characteristics)" only (rendered and read); no rate printed.
#   - Operating temperature range is a single row (-55 to 125 degC); no derating curve is printed.
# Product URL: the reference sheet prints no product page address; the only URL printed in the PDF is
# No datasheet URL is printed (only a contact form); datasheet_url says so and datasheet_file is the source (open item).

[part]
value           = "GCM188"                    # series: the catalog values are rows of catalog.csv
manufacturer    = "Murata"
description     = "Chip multilayer ceramic capacitors, X7R (R7) and C0G (5C), 1608M (0603), AEC-Q200 (GCM series)"
category        = "capacitor_mlcc"
package         = "1608M (0603)"
kicad_symbol    = "GCM188.kicad_sym"
kicad_footprint = "GCM188.kicad_mod"
step            = "GCM188.step"
datasheet_url   = ""  # open item: the reference sheet prints no datasheet URL (only a contact form); use datasheet_file
datasheet_file  = "docs/datasheets/GCM188R71H104KA57-01A-EN.pdf"  # reference sheet of GCM188R71H104KA57; the per-part rows come from it
datasheet_rev   = "01A"
datasheet_date  = "2026-04"                   # DS p.2 "product specifications are as of Apr.8,2026"
series          = "capacitor"
catalog         = "catalog.csv"
catalog_decoder = "murata-gcm"          # lib.check re-decodes every row (lib/catalog.py tables, cross-check only)
tc_param        = { X7R = "tc_x7r", C0G = "tc_c0g" }  # dielectric -> the row holding its temperature characteristic
package_default    = "D"                      # DS p.2 Package table: the example package letter
package_alternates = ["W", "J", "V"]          # DS p.2 Package table: the other package letters (packaging only)

# Pins: DS p.2 Type & Dimension figure. Non-polarized two-terminal chip capacitor; pin names are the terminal numbers.

[[pin]]
number   = "1"
name     = "1"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

[[pin]]
number   = "2"
name     = "2"
type     = "passive"
function = "Capacitor terminal (non-polarized)"
cite     = "DS p.2, Type & Dimension, image:Dimension"

# Shared rows: size and series generic (apply to every variant in this family).

# Land pattern (footprint, reflow). Size-generic for the 1608M size. DS p.27 "2. Land Dimensions", Table 2 (Reflow),
# row "1.6x0.8 (+/-0.10)", chip code 18 (1608M). The DS labels the dimensions only by letter (figure on p.27): neutral
# names. Inferred meaning, not printed: a = land-to-land gap, b = land length, c = land width. Ranges as printed.
# Flow soldering (Table 1) also covers 1.6x0.8 (code 18, a 0.6 to 1.0, b 0.8 to 0.9, c 0.6 to 0.8). Not stored: the
# reflow row is the one for the reflow mounting method (DS p.2 lists Flow and Reflow). Open item: pick flow or reflow.

[param.land_a]
name       = "Land pattern dimension a (reflow)"
symbol     = "a"
kind       = "mechanical"
scope      = "na"
min        = 0.6
max        = 0.8
unit       = "mm"
conditions = "Reflow soldering, chip 1.6x0.8 (+/-0.10), chip code 18"
cite       = "DS p.27, 2. Land Dimensions, Table 2 Reflow Soldering Method, 1.6x0.8 (+/-0.10), a"
verified   = "sonnet-audit 2026-11-18 blind page-image reading, cross-model (diet-work/audit/AUDIT.md)"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: gap between lands (not printed)."

[param.land_b]
name       = "Land pattern dimension b (reflow)"
symbol     = "b"
kind       = "mechanical"
scope      = "na"
min        = 0.6
max        = 0.7
unit       = "mm"
conditions = "Reflow soldering, chip 1.6x0.8 (+/-0.10), chip code 18"
cite       = "DS p.27, 2. Land Dimensions, Table 2 Reflow Soldering Method, 1.6x0.8 (+/-0.10), b"
verified   = "sonnet-audit 2026-11-18 blind page-image reading, cross-model (diet-work/audit/AUDIT.md)"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: land length, outer side (not printed)."

[param.land_c]
name       = "Land pattern dimension c (reflow)"
symbol     = "c"
kind       = "mechanical"
scope      = "na"
min        = 0.6
max        = 0.8
unit       = "mm"
conditions = "Reflow soldering, chip 1.6x0.8 (+/-0.10), chip code 18"
cite       = "DS p.27, 2. Land Dimensions, Table 2 Reflow Soldering Method, 1.6x0.8 (+/-0.10), c"
verified   = "sonnet-audit 2026-11-18 blind page-image reading, cross-model (diet-work/audit/AUDIT.md)"
note       = "Letter label only in the DS figure; neutral name. Inferred meaning: land width across the chip (not printed)."

