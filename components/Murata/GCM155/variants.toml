# GCM155 family variants. One variant so far: GCM155R71H104KE02 (1005M, X7R R7, 0.1 uF, DC 50 V, +/-10 %).
# Source: docs/datasheets/GCM155R71H104KE02-01A-EN.pdf, product specifications as of Apr.6,2026 (DS p.2 is the decode).
#
# Part decode (DS p.2, MURATA Part No. System, example GCM155R71H104KE02D):
#   GCM series, 15 = L x W 1005M (0402), 5 = T 0.5 mm, R7 = X7R (EIA) temperature characteristic, 1H = DC 50 V,
#   104 = 0.1 uF, K = +/-10 %, E02 = individual specification (Murata control code), D = package.
# Package letters (DS p.2 Package table): D = phi180 reel, paper tape W8P2, 10000 pcs/reel; W = phi180, W8P1,
#   20000 pcs/reel; J = phi330, W8P2, 50000 pcs/reel; V = phi330, W8P1, 100000 pcs/reel.
#   mpn = the D package (the example package in the decode); alternates = the other package letters (packaging only).
#
# Shared rows (component.toml): L, W, R7 temperature characteristic, operating temperature range.
# Rows below are value-specific: capacitance, rated voltage, tolerance, T, e, g, and the Specifications and Test
# Methods limits (pp.3-6). Every test row is a limit after the stated stress (scope "na"), except the 25 degC rows.
# Test voltages in the Specifications table (1.3 V DC with 6.8 kohm, 150 % and 250 % of rated, 1.0 Vrms measurement)
# are test conditions, not limits: they are quoted in conditions and not stored as rows.
# IR (insulation resistance) limits are printed in ohm*F ("More than 50 ohm.F"). The loader has no unit for the product
# ohm*F, so IR rows are text rows with the printed number in the text; this needs a SPEC unit to be checked numerically.
# Beam load is printed in N, which the loader does not know: stored as a text row.

[variant."GCM155R71H104KE02"]
mpn         = "GCM155R71H104KE02D"
alternates  = ["GCM155R71H104KE02W", "GCM155R71H104KE02J", "GCM155R71H104KE02V"]
temp_grade  = "-55 to 125 degC"
description = "Chip multilayer ceramic capacitor, X7R (R7), 1005M (0402), 0.1 uF, DC 50 V, +/-10 %, AEC-Q200"
datasheet_file = "docs/datasheets/GCM155R71H104KE02-01A-EN.pdf"

# Rated value (DS p.2, Rated Value)

[variant."GCM155R71H104KE02".param.capacitance]
name       = "Capacitance"
symbol     = "C"
kind       = "electrical"
scope      = "25C"
typ        = 0.1
unit       = "uF"
conditions = "25 degC, 1.0 +/-0.1 kHz, 1.0 +/-0.2 Vrms (DS p.6, No. 17)"
cite       = "DS p.2, Rated Value, Capacitance (0.1uF)"

[variant."GCM155R71H104KE02".param.rated_v]
name       = "Rated voltage (DC)"
kind       = "rec_op"
scope      = "na"
min        = -50
max        = 50
unit       = "V"
min_ref    = "2"
max_ref    = "2"
check_pins = ["1"]
conditions = "Voltage between pin 1 and pin 2 (non-polarized; either polarity)"
cite       = "DS p.2, Rated Value, Rated Voltage (DC 50V)"
note       = "DS prints DC 50V with no MIN/MAX label. Stored symmetric (min -50, max 50) because the part is non-polarized: |V(1)-V(2)| <= 50 V. Checked by the Zener wrapper against pin 2."

[variant."GCM155R71H104KE02".param.tolerance]
name       = "Capacitance tolerance"
kind       = "electrical"
scope      = "na"
min        = -10
max        = 10
unit       = "%"
conditions = ""
cite       = "DS p.2, Rated Value, Capacitance Tolerance (+/-10 %)"
note       = "Printed +/-10 % as a limit: min -10, max 10 (SPEC +/-X rule)."

