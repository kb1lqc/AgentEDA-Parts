# INA241 family, VSSOP-8 (DGK): ten orderables (version A and B x gain 10/20/50/100/200 V/V), listed here.
# Each variant sets its mpn (= Value + R reel suffix), alternates (none: DS Addendum-Page 1-2 (PDF p.28-29) lists only the R reel for DGK) and
# temp_grade (-40 to 125 degC, DS p.4 TA rec-op and Addendum-Page 2 (PDF p.29) Op temp). The B devices share their values with the shared rows
# in component.toml (restricted with `variants`); the A devices get their own rows here.
# Gain (G, DS p.5 OUTPUT, Gain row: A1,B1 10; A2,B2 20; A3,B3 50; A4,B4 100; A5,B5 200 V/V) is per variant (every variant
# has its own `gain` row). The A device gain-error, drift, Vos and Vos drift rows are per variant (DS p.5-6).

[variant."INA241A1IDGK"]
mpn         = "INA241A1IDGKR"
alternates  = []
temp_grade  = "-40 to 125 degC"
description = "INA241A1 gain 10 V/V, VSSOP-8 (DGK), -40 to 125 degC"

[variant."INA241A1IDGK".param.gain]
name       = "Gain"
symbol     = "G"
kind       = "electrical"
scope      = "25C"
typ        = 10
unit       = ""
conditions = "VS = 5 V, VSENSE = VIN+ - VIN-, VCM = VIN- = 48 V, VREF1 = VREF2 = VS / 2 (TA = 25 degC)"
cite       = "DS p.5, 6.5 Electrical Characteristics, OUTPUT, Gain, A1, B1 Devices row"
note       = "Typical only (no MIN or MAX printed for gain). Per-variant row: the gain is set by the device version."

[variant."INA241A1IDGK".param.gain_err_25c]
name       = "Gain error"
symbol     = "GERR"
kind       = "electrical"
scope      = "25C"
typ        = 0.002
typ_pm     = true
min        = -0.01
max        = 0.01
unit       = "%"
conditions = "(GND + 50 mV) < VOUT < (VS - 200 mV), TA = 25 degC"
cite       = "DS p.6, 6.5 Electrical Characteristics, OUTPUT, GERR, Gain error, INA241A1, INA241A2, INA241A3"
note       = "TYP printed +/-, MAX printed +/-: typ_pm, min = -max. Per-variant row (A devices)."

[variant."INA241A1IDGK".param.gain_drift_full]
name       = "Gain error drift"
symbol     = "GERR drift"
kind       = "electrical"
scope      = "full"
typ        = 0.05
typ_pm     = true
min        = -1
max        = 1
unit       = "ppm/degC"
conditions = "TA = -40 degC to 125 degC"
cite       = "DS p.6, 6.5 Electrical Characteristics, OUTPUT, GERR, Gain error drift, INA241A1, INA241A2, INA241A3"
note       = "TYP printed +/-, MAX printed +/-: typ_pm, min = -max. Per-variant row (A devices)."

[variant."INA241A1IDGK".param.vos_25c]
name       = "Offset voltage, input-referred"
symbol     = "VOS"
kind       = "electrical"
scope      = "25C"
typ        = 5
typ_pm     = true
min        = -20
max        = 20
unit       = "uV"
conditions = "VSENSE = 0 mV (TA = 25 degC)"
cite       = "DS p.5, 6.5 Electrical Characteristics, INPUT, Offset voltage, input-referred, INA241A1"
note       = "TYP printed +/-, MAX printed +/-: typ_pm, min = -max. Per-variant row (A devices)."

[variant."INA241A1IDGK".param.vos_drift_full]
name       = "Offset voltage drift, input-referred"
symbol     = "dVOS/dT"
kind       = "electrical"
scope      = "full"
typ        = 50
typ_pm     = true
min        = -250
max        = 250
unit       = "nV/degC"
conditions = "TA = -40 degC to 125 degC"
cite       = "DS p.5, 6.5 Electrical Characteristics, INPUT, Offset voltage drift, input-referred, INA241A1"
note       = "TYP printed +/-, MAX printed +/-: typ_pm, min = -max. Per-variant row (A devices)."

