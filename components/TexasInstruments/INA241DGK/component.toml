# INA241 family, VSSOP-8 (DGK) package: 10 orderables (version A/B x gain 10/20/50/100/200 V/V), listed in variants.toml.
# Raw datasheet values in printed units (docs/SPEC.md). DS = TI INA241A/INA241B datasheet, SBOSA30D (Rev. D, Dec 2024),
# printed page numbers. Package addendum cites are "DS Addendum-Page 1-2 (PDF p.28-29)": the addendum pages carry no main printed number.
# Rows that differ per variant are either restricted with `variants` here (B group where the B devices share a value),
# or given per variant in variants.toml (A devices, and every gain row). The calc INPUTS keys exist for every variant.

[part]
value           = "INA241DGK"
manufacturer    = "Texas Instruments"
description     = "Bidirectional current-sense amplifier, -5 V to 110 V common mode, 2.7 V to 20 V supply, VSSOP-8 (DGK)"
category        = "current_sense_amplifier"
package         = "VSSOP-8 (DGK0008A)"
datasheet_url   = "https://www.ti.com/lit/ds/symlink/ina241a.pdf"
datasheet_file  = "docs/datasheets/ina241a.pdf"
datasheet_rev   = "SBOSA30D"
datasheet_date  = "2024-12"                # DS p.26, 10 Revision History; cover "Revised December 2024"
kicad_symbol    = "INA241DGK.kicad_sym"
kicad_footprint = "INA241DGK.kicad_mod"
step            = "INA241DGK.step"

# Ordering: DS Addendum-Page 1-2 (PDF p.28-29), Package Option Addendum, DGK rows (VSSOP (DGK) | 8, 2500 | LARGE T&R, Active, Production,
#   lead finish NIPDAU, MSL Level-2-260C-1 YEAR, Op temp -40 to 125). Every DGK orderable is only the "R" reel
#   (no DGKT or tube); the ".B" rows (INA241A1IDGKR.B) are the same orderable and are not alternates.
# Other qualified versions: INA241A-Q1, INA241B-Q1 (DS p.30): automotive grade, a different part; not an alternate.
# Lifecycle, revision currency, errata, PCN: not checked (no web access).

# ---------------------------------------------------------------- pins
# DS p.2, 5 Pin Configuration and Functions, Table 5-1 Pin Functions: D, DDF and DGK Packages (pins 1-8; the table
# continues on DS p.3). Figure 5-2 (DS p.2) gives the DGK pin positions: 1 IN-, 2 GND, 3 REF2, 4 NC on the left;
# 5 OUT, 6 VS, 7 REF1, 8 IN+ on the right. Names verbatim; the DS en dash in IN- is ASCII "-".
# VS: the DS prints the subscript V(S) in Table 5-1 and "Vs" in Figure 5-2; "VS" is used.
# NC (pin 4): the DS TYPE column says Ground and the description says "Reserved. Connect to ground." The symbol type is
#   power_in (set by the coordinator, matching the symbol). The pin is named NC, so the Zener wrapper treats it as a net.
# No exposed pad on DGK (DS p.2 figure, 8 pins; DS p.37-38 DGK land pattern has no thermal pad).

[[pin]]
number   = "1"
name     = "IN-"
type     = "input"
function = "Current-sense amplifier negative input. High-side: connect to load side of sense resistor. Low-side: connect to ground side of sense resistor"
cite     = "DS p.2, Table 5-1 Pin Functions: D, DDF and DGK Packages, IN- (pin 1)"

[[pin]]
number   = "2"
name     = "GND"
type     = "power_in"
function = "Ground"
cite     = "DS p.2, Table 5-1 Pin Functions: D, DDF and DGK Packages, GND (pin 2)"

[[pin]]
number   = "3"
name     = "REF2"
type     = "input"
function = "Reference 2 voltage. Connect to voltage potential from 0 V to VS; see Adjusting the Output With the Reference Pins"
cite     = "DS p.3, Table 5-1 Pin Functions: D, DDF and DGK Packages (continued), REF2 (pin 3)"

[[pin]]
number   = "4"
name     = "GND"
type     = "power_in"
function = "DS name NC: 'Reserved. Connect to ground.' (DS TYPE column: Ground). Named GND here so the wrapper ties it to ground: pcb lint symbol.pin.nc_type rejects a pin named NC that is not no_connect, and a no_connect pin cannot follow the DS instruction. Same rule as an exposed pad that must connect to a net (CLAUDE.md Defaults)."
cite     = "DS p.2, Table 5-1 Pin Functions: D, DDF and DGK Packages, NC (pin 4)"

[[pin]]
number   = "5"
name     = "OUT"
type     = "output"
function = "Output voltage"
cite     = "DS p.2, Table 5-1 Pin Functions: D, DDF and DGK Packages, OUT (pin 5)"

[[pin]]
number   = "6"
name     = "VS"
type     = "power_in"
function = "Power supply, 2.7 V to 20 V"
cite     = "DS p.3, Table 5-1 Pin Functions: D, DDF and DGK Packages (continued), VS (pin 6)"

[[pin]]
number   = "7"
name     = "REF1"
type     = "input"
function = "Reference 1 voltage. Connect to voltage potential from 0 V to VS; see Adjusting the Output With the Reference Pins"
cite     = "DS p.3, Table 5-1 Pin Functions: D, DDF and DGK Packages (continued), REF1 (pin 7)"

[[pin]]
number   = "8"
name     = "IN+"
type     = "input"
function = "Current-sense amplifier positive input. High-side: connect to bus-voltage side of sense resistor. Low-side: connect to load side of sense resistor"
cite     = "DS p.2, Table 5-1 Pin Functions: D, DDF and DGK Packages, IN+ (pin 8)"

# ---------------------------------------------------------------- absolute maximum ratings
# DS p.4, 6.1 Absolute Maximum Ratings, over operating free-air temperature range (unless otherwise noted), footnote (1).
# Printed in MIN and MAX columns. Rows with a printed reference (GND) are checked against that pin; rows without a
# printed reference are absolute volts (= vs system 0 V, GND). Scope na (abs max).

[param.vs_abs]
name       = "Supply voltage"
symbol     = "VS"
kind       = "abs_max"
scope      = "na"
max        = 22
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.4, 6.1 Absolute Maximum Ratings, Supply voltage (VS)"
note       = "Only a MAX is printed (MIN column blank). No reference pin is printed for this row; applied as VS vs GND."
unchecked  = "covered by vs_rec (2.7 V to 20 V, checked, error), which is stricter"

[param.vdiff_abs]
name       = "Analog inputs, differential voltage"
symbol     = "V(IN+) - V(IN-)"
kind       = "abs_max"
scope      = "na"
min        = -30
max        = 30
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.4, 6.1 Absolute Maximum Ratings, Analog inputs VIN+, VIN-, Differential (VIN+) - (VIN-)"
note       = "Pin-pair row: IN+ relative to IN- (footnote 2: VIN+ and VIN- are the voltages at the IN+ and IN- pins). The second pin is the reference (SPEC pin-pair rule)."
check_pins = ["IN+"]
min_ref    = "IN-"
max_ref    = "IN-"

[param.vcm_abs]
name       = "Analog inputs, common-mode voltage"
symbol     = "VIN+, VIN-"
kind       = "abs_max"
scope      = "na"
min        = -20
max        = 120
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.4, 6.1 Absolute Maximum Ratings, Analog inputs VIN+, VIN-, Common-mode"
note       = "Each input pin voltage. No reference pin is printed; applied as each pin vs GND (system 0 V)."
unchecked  = "covered by vcm_rec (-5 V to 110 V, checked, error), which is stricter"

[param.vref_abs]
name       = "REF1, REF2, NC inputs"
symbol     = "VREF1, VREF2, VNC"
kind       = "abs_max"
scope      = "na"
min        = -0.3
min_ref    = "GND"
max        = 0.3
max_ref    = "VS"
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.4, 6.1 Absolute Maximum Ratings, REF1, REF2, NC inputs"
note       = "Printed GND - 0.3 V to VS + 0.3 V: the DS states the reference is GND, so min_ref = GND and max_ref = VS (SPEC rule). The NC pin (symbol name GND, pin 4) is not checked separately: it is tied to GND, the reference of this row."
check_pins = ["REF1", "REF2"]

[param.vout_abs]
name       = "Output pin"
symbol     = "VOUT"
kind       = "abs_max"
scope      = "na"
min        = -0.3
min_ref    = "GND"
max        = 0.3
max_ref    = "VS"
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.4, 6.1 Absolute Maximum Ratings, Output"
note       = "Printed GND - 0.3 V to VS + 0.3 V; reference GND as printed in the row."
unchecked  = "OUT is driven by the part; owner: module"

[param.ta_abs]
name       = "Operating temperature"
symbol     = "TA"
kind       = "abs_max"
scope      = "na"
min        = -55
max        = 150
unit       = "degC"
conditions = "operating temperature"
cite       = "DS p.4, 6.1 Absolute Maximum Ratings, Operating temperature, TA"
unchecked  = "covered by ta_rec (-40 degC to 125 degC, check_ambient, error), which is stricter"

[param.tj_abs]
name       = "Junction temperature"
symbol     = "TJ"
kind       = "abs_max"
scope      = "na"
max        = 150
