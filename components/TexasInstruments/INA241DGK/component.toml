cite       = "DS p.4, 6.1 Absolute Maximum Ratings, Junction temperature, TJ"
unchecked  = "needs dissipation x RthetaJA; owner: module"

[param.tstg_abs]
name       = "Storage temperature"
symbol     = "Tstg"
kind       = "abs_max"
scope      = "na"
