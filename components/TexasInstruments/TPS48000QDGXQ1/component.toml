# ---------------------------------------------------------------------------------------------------------------

[param.abs_vs_cs_gnd]
name       = "VS, CS+, CS- voltage to GND"
symbol     = "VS, CS+, CS-"
kind       = "abs_max"
scope      = "na"
min        = -65
max        = 100
min_ref    = "GND"
max_ref    = "GND"
unit       = "V"
conditions = "Absolute maximum, referenced to GND"
cite       = "DS p.5, 5.1 Absolute Maximum Ratings, Input Pins, VS, CS+, CS- to GND"
verified   = "human:kb1lqc 2026-11-24 page-image ds_review f4566ecc335e row bb80c25725b1"
note       = "Reference GND from the row title ('to GND'). Pin-pair rows (CS+ to CS-) are a separate row below."
