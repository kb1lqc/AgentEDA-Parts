# TPS48000-Q1 (TPS4800-Q1 datasheet) 100 V automotive low-IQ high-side driver, DGX (VSSOP-19) package.
# Raw datasheet values in printed units (docs/SPEC.md). Source: docs/datasheets/tps4800-q1.pdf, SLUSEZ1B Rev. B
# (Dec 2023, revised Mar 2026). Printed page numbers are cited; PDF page = printed page for pages 2-31.
# Orderable: TPS48000QDGXRQ1 (Production, Active, DS PDF p.32 Package Option Addendum, dated 23-Sep-2025). The
# preproduction PTPS48000QDGXRQ1 is not an alternate. The .A suffix row is the same orderable; alternates = [].
# Lead finish NIPDAU; MSL Level-2-260C-1 YEAR; RoHS Yes (DS PDF p.32 addendum). Lifecycle beyond the printed status:
# not checked (no web access).
# Device options: the DS covers the TPS4800-Q1 family but its body and the addendum name only TPS48000-Q1 in the
# DGX package. No option-specific rows are stored (the DS prints no other option with different ratings).
# General test condition for every Electrical Characteristics row (DS p.6, 5.5 header): TJ = -40 to +150 degC,
# V(VS) = 48 V, V(BST-SRC) = 11 V. Those rows are scope "full" (over TJ -40 to 150 degC) unless the row says otherwise.
# The DS prints no ambient (TA) range in a table. The grade-1 ambient range is a Features bullet (DS p.1: "Device
# temperature grade 1: -40 degC to +125 degC ambient operating temperature range"); it is stored as rec_op
# ta_grade_1 with check_ambient = true.
# Abs-max and rec-op voltages are referenced as printed in the DS (GND, SRC, VS, CS-). The DS states no global
# reference; each row names its reference pin as printed in the row title ("to GND", "to SRC", pin pair).
# Pin 16 is not in the DS pin table: DGX pin numbers run 1-15 and 17-20 (19 pins). See pin notes below.
# Revision currency, errata, PCN and lifecycle: not checked (no web access).

[part]
value           = "TPS48000QDGXQ1"
mpn             = "TPS48000QDGXRQ1"
alternates      = []
manufacturer    = "Texas Instruments"
description     = "100 V automotive low-IQ high-side driver with reverse polarity, short-circuit protection and diagnostics, VSSOP-19 (DGX), TPS4800-Q1 data sheet"
category        = "high_side_driver"
package         = "VSSOP-19 (DGX), 5.1 x 3.0 mm nominal (DS p.1 Package Information)"
datasheet_url   = "https://www.ti.com/lit/ds/symlink/tps4800-q1.pdf"
datasheet_file  = "docs/datasheets/tps4800-q1.pdf"
datasheet_rev   = "SLUSEZ1B Rev. B"          # DS p.1 footer: SLUSEZ1B - December 2023 - revised March 2026
datasheet_date  = "2026-03"                  # DS p.1 footer, revised March 2026
temp_grade      = "TJ -40 to 150 degC; ambient -40 to 125 degC (grade 1)"
kicad_symbol    = "TPS48000QDGXQ1.kicad_sym"
kicad_footprint = "TPS48000QDGXQ1.kicad_mod"
step            = "TPS48000QDGXQ1.step"

# ---------------------------------------------------------------------------------------------------------------
# Pins: DS p.3 Figure 4-1 (DGX top view) and DS p.3-4 Table 4-1 "Pin Functions". Names as printed in Table 4-1.
# Type from the Table 4-1 function text (see notes per pin). Pin 16 has no entry in the DS table and no position
# in Figure 4-1 (DGX is a 19-pin package and the DS numbers its pins 1-15 and 17-20).
# No exposed pad is printed for the DGX package in Table 4-1 or Figure 4-1.
# ---------------------------------------------------------------------------------------------------------------

[[pin]]
number   = "1"
name     = "EN/UVLO"
type     = "input"
function = "Condensed from DS Table 4-1: EN/UVLO input. A voltage higher than 1 V enables normal operation. Below 0.3 V shuts down the device; optionally connect to the input supply through a resistive divider to set the UVLO. Floating: internal pull-down keeps the device in shutdown."
cite     = "DS p.3, Table 4-1 Pin Functions, EN/UVLO"

[[pin]]
number   = "2"
name     = "OV"
type     = "input"
function = "Condensed from DS Table 4-1: Adjustable overvoltage threshold input. Resistor ladder from input supply, OV to GND. Must be connected to GND when not used (internal pull-down holds PU to BST when floating)."
cite     = "DS p.3, Table 4-1 Pin Functions, OV"

[[pin]]
number   = "3"
name     = "INP"
type     = "input"
function = "Condensed from DS Table 4-1: Input signal for external discharge FET control. CMOS compatible input referenced to GND that sets the state of PD and PU. Internal weak pull-down to GND."
cite     = "DS p.3, Table 4-1 Pin Functions, INP"

[[pin]]
number   = "4"
name     = "FLT_GD"
type     = "open_collector"
function = "Condensed from DS Table 4-1: Open drain fault output for gate drive UVLO. Asserts low when gate drive across PD to SRC is above 7 V (typ.)."
cite     = "DS p.3, Table 4-1 Pin Functions, FLT_GD"

[[pin]]
number   = "5"
name     = "FLT"
type     = "open_collector"
function = "Condensed from DS Table 4-1: Open drain fault output. Asserts low during short circuit fault, input UVLO, overvoltage and during SCP comparator diagnosis. Connect to GND if FLT feature not desired."
cite     = "DS p.3, Table 4-1 Pin Functions, FLT"

[[pin]]
number   = "6"
name     = "GND"
type     = "power_in"
function = "Condensed from DS Table 4-1: Connect GND to system ground. (DS type G, ground)"
cite     = "DS p.3, Table 4-1 Pin Functions, GND"

[[pin]]
number   = "7"
name     = "CS_SEL"
type     = "input"
function = "Condensed from DS Table 4-1: Current sense select input. Connect to ground for high side current sense. Drive above 1.58 V for low side current sensing. Internal weak pull-down to GND."
cite     = "DS p.3, Table 4-1 Pin Functions, CS_SEL"

[[pin]]
number   = "8"
name     = "ISCP"
type     = "passive"
function = "Condensed from DS Table 4-1: Short circuit detection setting. A resistor across ISCP to GND sets the short circuit current comparator threshold (external bias on ISCP is the alternative, DS p.17). Connect ISCP and TMR to GND if short-circuit protection is not desired. DS type I; passive because an external resistor or bias sets the node."
cite     = "DS p.3, Table 4-1 Pin Functions, ISCP"

[[pin]]
number   = "9"
name     = "TMR"
type     = "passive"
function = "Condensed from DS Table 4-1: Fault timer input. A capacitor across TMR to GND sets the times for fault turn-off. Leave open for fastest setting. DS type I; passive because the external capacitor sets the node."
cite     = "DS p.3, Table 4-1 Pin Functions, TMR"

[[pin]]
number   = "10"
name     = "SCP_TEST"
type     = "input"
function = "Condensed from DS Table 4-1: Internal short circuit comparator (SCP) diagnosis input. Driven low to high with INP high checks the SCP comparator; FLT goes low and PD is pulled to SRC if the comparator is functional. Connect to GND if not used. Internal weak pull-down to GND."
cite     = "DS p.3, Table 4-1 Pin Functions, SCP_TEST"

[[pin]]
number   = "11"
name     = "N.C"
type     = "no_connect"
function = "Condensed from DS Table 4-1: No connect."
cite     = "DS p.4, Table 4-1 Pin Functions, N.C (pin 11)"

[[pin]]
number   = "12"
name     = "BST"
type     = "passive"
function = "Condensed from DS Table 4-1: High side bootstrapped supply. External capacitor (minimum > Qg(tot) of the external FET) between BST and SRC. DS type O; a charge-pump capacitor node, so passive for schematic capture."
cite     = "DS p.4, Table 4-1 Pin Functions, BST"

[[pin]]
number   = "13"
name     = "SRC"
type     = "passive"
function = "Condensed from DS Table 4-1: Source connection of the external FET. DS type O; the external FET source node, so passive for schematic capture."
cite     = "DS p.4, Table 4-1 Pin Functions, SRC"

[[pin]]
number   = "14"
name     = "PD"
type     = "passive"
function = "Condensed from DS Table 4-1: High current gate driver pull-down. Pulls down to SRC. Tie directly to the gate of the external high side MOSFET for fastest turn-off. DS type O; passive because PU and PD are normally tied together (an output-output pair fails KiCad ERC)."
cite     = "DS p.4, Table 4-1 Pin Functions, PD"

[[pin]]
number   = "15"
name     = "PU"
type     = "passive"
function = "Condensed from DS Table 4-1: High current gate driver pull-up. Pulls up to BST. Connect to PD for maximum transition speed. A resistor from PU to the gate controls turn-on inrush. DS type O; passive because PU and PD are normally tied together (an output-output pair fails KiCad ERC)."
cite     = "DS p.4, Table 4-1 Pin Functions, PU"

[[pin]]
number   = "17"
name     = "CS-"
type     = "input"
function = "Condensed from DS Table 4-1: Current sense negative input."
cite     = "DS p.4, Table 4-1 Pin Functions, CS-"

[[pin]]
number   = "18"
name     = "CS+"
type     = "input"
function = "Condensed from DS Table 4-1: Current sense positive input."
cite     = "DS p.4, Table 4-1 Pin Functions, CS+"

[[pin]]
number   = "19"
name     = "N.C"
type     = "no_connect"
function = "Condensed from DS Table 4-1: No connect."
cite     = "DS p.4, Table 4-1 Pin Functions, N.C (pin 19)"

[[pin]]
number   = "20"
name     = "VS"
type     = "power_in"
function = "Condensed from DS Table 4-1: Supply pin of the controller (DS type P, power)."
cite     = "DS p.4, Table 4-1 Pin Functions, VS"

# ---------------------------------------------------------------------------------------------------------------
# 5.1 Absolute Maximum Ratings: DS p.5. Header "over operating free-air temperature range (unless otherwise noted)".
# Rows are as printed (MIN, MAX). Reference pins are the pins named in each row title; the DS prints no global
