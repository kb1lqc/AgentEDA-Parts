# INA821 (VSSOP-8, DGK) data. Raw datasheet values in printed units; no derating, no rounding.
# DS = Texas Instruments INA821 datasheet, SBOS893D (Rev. D, revised June 2020), printed page numbers.
# Package addendum cites are "DS PDF p.<n>" (no printed page number).
# Pin 2 and pin 3 are both printed "RG" in the DS; they are separate nodes, so the symbol names them RG1 and RG2.

[part]
value           = "INA821IDGK"
mpn             = "INA821IDGKR"
alternates      = ["INA821IDGKT"]
manufacturer    = "Texas Instruments"
description     = "Precision instrumentation amplifier, 4.5-36 V"
category        = "instrumentation_amplifier"
package         = "VSSOP-8 (DGK0008A)"
datasheet_url   = "https://www.ti.com/lit/ds/symlink/ina821.pdf"
datasheet_file  = "docs/datasheets/ina821.pdf"
datasheet_rev   = "SBOS893D"
datasheet_date  = "2020-06"
temp_grade      = "-40 to 125 degC"
kicad_symbol    = "INA821IDGK.kicad_sym"
kicad_footprint = "INA821IDGK.kicad_mod"
step            = "embedded"

# Ordering: DS PDF p.35, Package Option Addendum, INA821IDGKR: VSSOP (DGK) 8 pins, 2500 LARGE T&R, Active,
#   lead finish "NIPDAU | SN", MSL Level-2-260C-1 YEAR, Op temp -40 to 125 C.
# INA821IDGKT: same package, 250 SMALL T&R, same finish and MSL (listed on the same page, so an alternate).
# Lead finish "NIPDAU | SN" carries a tin-whisker open item (CLAUDE.md, Defaults). Revision currency, errata, PCN and
# lifecycle: not checked (no web access). Package addendum lists status Active on the printed date 18-Aug-2026.

# ---------------------------------------------------------------- pins
# DS p.4, 6 Pin Functions (pin numbers and names). Types match the symbol INA821IDGK.kicad_sym exactly.
# Pin 4 +IN: the DS I/O column prints "O"; the function text says positive (noninverting) input. The function text
#   and the pin diagram agree on input, so the symbol type "input" is kept. DS error, open item.
# Pins 2 and 3 RG: the DS I/O column prints "I"; the symbol type is "passive" (external gain resistor, SPEC rule).
# No thermal pad on the DGK package: DS p.4, 6 Pin Functions pin diagram (D and DGK packages, 8 pins, no pad) and
# DS PDF p.41, DGK0008A EXAMPLE BOARD LAYOUT, LAND PATTERN EXAMPLE (8 signal pads, no center pad). The "Thermal pad"
# row in the DS Pin Functions table is for the DRG package. DS PDF p.40 drawing carries a "PowerPAD is a trademark" line
# (drawing boilerplate); the DGK figures show no exposed pad.

[[pin]]
number   = "1"
name     = "-IN"
type     = "input"
function = "Negative (inverting) input"
cite     = "DS p.4, 6 Pin Functions, -IN (pin 1)"

[[pin]]
number   = "2"
name     = "RG1"
type     = "passive"
function = "Gain setting pin; gain resistor RG connects between pin 2 and pin 3. Symbol name RG1 (separate node from pin 3)"
cite     = "DS p.4, 6 Pin Functions, RG (pins 2, 3)"

[[pin]]
number   = "3"
name     = "RG2"
type     = "passive"
function = "Gain setting pin; gain resistor RG connects between pin 2 and pin 3. Symbol name RG2 (separate node from pin 2)"
cite     = "DS p.4, 6 Pin Functions, RG (pins 2, 3)"

[[pin]]
number   = "4"
name     = "+IN"
type     = "input"
function = "Positive (noninverting) input"
cite     = "DS p.4, 6 Pin Functions, +IN (pin 4)"

[[pin]]
number   = "5"
name     = "-VS"
type     = "power_in"
function = "Negative supply"
cite     = "DS p.4, 6 Pin Functions, -VS (pin 5)"

[[pin]]
number   = "6"
name     = "REF"
type     = "input"
function = "Reference input; must be driven by a low impedance source"
cite     = "DS p.4, 6 Pin Functions, REF (pin 6)"

[[pin]]
number   = "7"
name     = "OUT"
type     = "output"
function = "Output"
cite     = "DS p.4, 6 Pin Functions, OUT (pin 7)"

[[pin]]
number   = "8"
name     = "+VS"
type     = "power_in"
function = "Positive supply"
cite     = "DS p.4, 6 Pin Functions, +VS (pin 8)"

# ---------------------------------------------------------------- absolute maximum ratings
# All rows: over operating free-air temperature range (unless otherwise noted), DS p.5. No reference pin is printed for
# the supply or the signal input rows; the checks decide the reference (see open items). Scope na (abs max).

[param.vs_abs]
name       = "Supply voltage"
kind       = "abs_max"
scope      = "na"
min        = -20
max        = 20
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.5, 7.1 Absolute Maximum Ratings, Supply voltage"
note       = "Printed -20 V to 20 V with no reference pin. Read as a 40 V maximum span between +VS and -VS: DS p.24, 8.3.5, 'Supply voltages higher than 40 V (+/-20 V) can permanently damage the device'. A per-rail reading would reject the 36 V single supply that rec-op allows (DS p.5, 7.3)."
unchecked  = "printed +/-20 V is a 40 V span (DS p.24, 8.3.5); covered by vs_rec_single (4.5 V to 36 V span, error), which is stricter"

[param.vin_abs]
name       = "Signal input pins, voltage"
kind       = "abs_max"
scope      = "na"
min        = -40
max        = 40
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.5, 7.1 Absolute Maximum Ratings, Signal input pins, Voltage"
note       = "Each input is rated alone (DS p.23, 8.3.4: -40 V on one input and +40 V on the other does not cause damage). No reference pin is printed; checked against system 0 V. DS p.23 shows input current only with +/-15 V supplies applied: driving an input while unpowered is not rated (owner: module)."
check_pins = ["+IN", "-IN"]

[param.vref_abs]
name       = "Signal input pins, REF pin"
kind       = "abs_max"
scope      = "na"
min        = -20
max        = 20
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.5, 7.1 Absolute Maximum Ratings, Signal input pins, REF pin"
note       = "Applied as: the REF pin within -20 V to 20 V of the system common, since no reference pin is printed (DS p.5, 7.1)."
check_pins = ["REF"]

[param.vout_abs]
name       = "Signal output pins"
kind       = "abs_max"
scope      = "na"
min        = -0.5
min_ref    = "-VS"
max        = 0.5
max_ref    = "+VS"
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.5, 7.1 Absolute Maximum Ratings, Signal output pins"
note       = "Printed as (-Vs) - 0.5 V to (+Vs) + 0.5 V."
unchecked  = "OUT is driven by the part; owner: module"

[param.ta_abs]
name       = "Operating temperature"
symbol     = "TA"
kind       = "abs_max"
scope      = "na"
min        = -50
max        = 150
unit       = "degC"
conditions = ""
cite       = "DS p.5, 7.1 Absolute Maximum Ratings, Operating Temperature, TA"
unchecked  = "covered by ta_rec (-40 degC to 125 degC, error), which is stricter"

[param.tj_abs]
name       = "Junction temperature"
symbol     = "TJ"
kind       = "abs_max"
scope      = "na"
max        = 175
unit       = "degC"
conditions = ""
cite       = "DS p.5, 7.1 Absolute Maximum Ratings, Junction Temperature, TJ"
unchecked  = "needs dissipation x rtheta_ja; owner: module"

[param.isc_abs]
name       = "Output short-circuit"
kind       = "abs_max"
scope      = "na"
text       = "Continuous"
unit       = ""
conditions = "short-circuit to VS / 2"
cite       = "DS p.5, 7.1 Absolute Maximum Ratings, Output short-circuit (2)"
note       = "Footnote (2) text: Short-circuit to VS / 2. Footnote (1) text: exposure to absolute-maximum-rated conditions for extended periods may affect device reliability. Not numeric: stored as text."
unchecked  = "text rating (Continuous, to VS/2); owner: board"

[param.tstg_abs]
name       = "Storage temperature"
symbol     = "Tstg"
kind       = "abs_max"
scope      = "na"
min        = -65
max        = 150
unit       = "degC"
conditions = ""
cite       = "DS p.5, 7.1 Absolute Maximum Ratings, Storage Temperature, Tstg"

