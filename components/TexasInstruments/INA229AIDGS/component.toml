# ---------------------------------------------------------------- electrical characteristics
# DS p.5 and p.6, 6.5 Electrical Characteristics. Table header: "at TA = 25 degC, VS = 3.3 V, VSENSE = VIN+ - VIN- = 0 V,
# VCM = VIN- = 48 V (unless otherwise noted)". A row with no own test condition takes that header and is scope "25C".
# Rows printed with TA = -40 degC to +125 degC are scope "full". Conditions are written as printed (ASCII).
# Unit conversions to units the loader accepts (exact, digits kept): uV/V and mV/V -> ppm (1 uV/V = 1 ppm; 1 mV/V = 1000
# ppm); m% -> % (2 m% = 0.002 %); m degC -> degC (7.8125 m degC = 0.0078125 degC); Bits and LSB -> "" (unitless count).
# Footnote (3) (characterized, not production tested) is not printed on these rows in this DS.

