# INA229 (VSSOP-10, DGS) data. Raw datasheet values in printed units; no derating, no rounding.
# DS = Texas Instruments INA229 datasheet, SLYS023A (Rev. A, revised May 2022), printed page numbers.
# Package addendum cites are "DS PDF p.<n>" (no printed page number).
# Table rows with no own test condition take the EC table header (TA = 25 degC, VS = 3.3 V, VSENSE = 0 V,
# VCM = VIN- = 48 V) and are scope "25C". Judgement calls and DS ambiguities are in each row's note and in the report.

[part]
value           = "INA229AIDGS"
mpn             = "INA229AIDGSR"
alternates      = []
manufacturer    = "Texas Instruments"
description     = "85 V, 20-bit power/energy/charge monitor with SPI interface"
category        = "power_monitor"
package         = "VSSOP-10 (DGS0010A)"
datasheet_url   = "https://www.ti.com/lit/ds/symlink/ina229.pdf"
datasheet_file  = "docs/datasheets/ina229.pdf"
datasheet_rev   = "SLYS023A"
datasheet_date  = "2022-05"
temp_grade      = "-40 to 125 degC"
kicad_symbol    = "INA229AIDGS.kicad_sym"
kicad_footprint = "INA229AIDGS.kicad_mod"
step            = "INA229AIDGS.step"

# Ordering: DS PDF p.40, Package Option Addendum (dated 7-Apr-2026): INA229AIDGSR, VSSOP (DGS) 10 pins, 2500 LARGE T&R,
#   Active, Production, RoHS Yes, lead finish/ball material "SN", MSL "Level-2-260C-1 YEAR", Op temp -40 to 125 C,
#   part marking 229I.
# INA229AIDGSR.A is listed on the same page with the same packaging (2500 LARGE T&R): same part, so not an alternate.
# Status "Active" is as printed on the addendum; revision currency, errata, PCN and lifecycle: not checked (no web access).
# Lead finish SN (tin): tin-whisker open item (CLAUDE.md Defaults).

# ---------------------------------------------------------------- pins
# DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions (ten pins, 1-10; Figure 5-1 agrees).
# Pin types from the DS function text: "Digital input" -> input, "Digital output" -> output, "Open-drain" -> open_collector,
#   "Analog input" -> input, "Power supply" and "Ground" -> power_in (as the reference parts).
# Names: the DS prints IN- and IN+ with a typographic minus; ASCII "-" written as IN- (SPEC: printed minus or en dash is written ASCII "-").
# No NC pins and no exposed pad: DS p.3 Table 5-1 lists ten signal/supply/ground pins only and no thermal pad row;
#   DS Figure 5-1 shows ten pins.
# Pin 1 marker: DS p.3 Figure 5-1 shows a dot at pin 1 (top-left).

[[pin]]
number   = "1"
name     = "CS"
type     = "input"
function = "SPI chip select (Active Low)"
cite     = "DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions, CS (pin 1)"

[[pin]]
number   = "2"
name     = "MOSI"
type     = "input"
function = "SPI digital data input"
cite     = "DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions, MOSI (pin 2)"

[[pin]]
number   = "3"
name     = "ALERT"
type     = "open_collector"
function = "Open-drain alert output, default state is active low"
cite     = "DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions, ALERT (pin 3)"

[[pin]]
number   = "4"
name     = "MISO"
type     = "output"
function = "SPI digital data output (push-pull)"
cite     = "DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions, MISO (pin 4)"

[[pin]]
number   = "5"
name     = "SCLK"
type     = "input"
function = "SPI clock input"
cite     = "DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions, SCLK (pin 5)"

[[pin]]
number   = "6"
name     = "VS"
type     = "power_in"
function = "Power supply, 2.7 V to 5.5 V"
cite     = "DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions, VS (pin 6)"

[[pin]]
number   = "7"
name     = "GND"
type     = "power_in"
function = "Ground"
cite     = "DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions, GND (pin 7)"

[[pin]]
number   = "8"
name     = "VBUS"
type     = "input"
function = "Bus voltage input"
cite     = "DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions, VBUS (pin 8)"

[[pin]]
number   = "9"
name     = "IN-"
type     = "input"
function = "Negative input to the device. High-side: connect to load side of sense resistor. Low-side: connect to ground side of sense resistor"
cite     = "DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions, IN- (pin 9)"

[[pin]]
number   = "10"
name     = "IN+"
type     = "input"
function = "Positive input to the device. High-side: connect to power supply side of sense resistor. Low-side: connect to load side of sense resistor"
cite     = "DS p.3, 5 Pin Configuration and Functions, Table 5-1 Pin Functions, IN+ (pin 10)"

# ---------------------------------------------------------------- absolute maximum ratings
# DS p.3, 6.1 Absolute Maximum Ratings: "over operating free-air temperature range (unless otherwise noted)". Footnote (1)
# is the usual stress statement. The DS states no pin reference for the supply, VIN and VBUS rows; the only reference
# statements are the GND and VS references printed on the VIO row (and the VIL/VOL/VOH rows in 6.5).

[param.vs_abs]
name       = "Supply voltage"
symbol     = "VS"
kind       = "abs_max"
scope      = "na"
max        = 6
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.3, 6.1 Absolute Maximum Ratings, Supply voltage VS"
verified   = "sonnet-audit 2026-11-18 blind page-image reading, cross-model (diet-work/audit/AUDIT.md)"
note       = "Only a MAX is printed (MIN column blank). No reference pin printed; checked against system 0 V (a floating GND is not modelled)."
unchecked  = "covered by vs_rec (2.7 V to 5.5 V, error), which is stricter"

[param.vin_diff_abs]
name       = "Differential input voltage, (VIN+) - (VIN-)"
symbol     = "VIN+, VIN-"
kind       = "abs_max"
scope      = "na"
min        = -40
max        = 40
min_ref    = "IN-"
max_ref    = "IN-"
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.3, 6.1 Absolute Maximum Ratings, VIN+, VIN- Differential (VIN+) - (VIN-)"
verified   = "sonnet-audit 2026-11-18 blind page-image reading, cross-model (diet-work/audit/AUDIT.md)"
note       = "Pin-pair row: the value is V(IN+), the reference is IN- (second pin as reference). Footnote (2) on the same table: VIN+ and VIN- are the voltages at the IN+ and IN- pins. check_pins IN+ with IN- as reference."
check_pins = ["IN+"]

[param.vcm_abs]
name       = "Common-mode input voltage, VIN+ and VIN-"
symbol     = "VIN+, VIN-"
kind       = "abs_max"
scope      = "na"
min        = -0.3
max        = 85
unit       = "V"
conditions = "over operating free-air temperature range (unless otherwise noted)"
cite       = "DS p.3, 6.1 Absolute Maximum Ratings, VIN+, VIN- Common-mode"
verified   = "sonnet-audit 2026-11-18 blind page-image reading, cross-model (diet-work/audit/AUDIT.md)"
note       = "Same limits as vcm_rec (DS p.4, 6.3). No reference pin printed (DS p.12, 7.3.1 gives -0.3 V to +85 V at the input pins with no reference); checked against system 0 V (a floating GND is not modelled)."
