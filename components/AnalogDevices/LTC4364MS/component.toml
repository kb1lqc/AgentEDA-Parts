max_ref    = "VCC"
unit       = "V"
conditions = ""
cite       = "DS p.2, Absolute Maximum Ratings, Voltage Difference (OUT to VCC)"
note       = "Difference V(OUT) - V(VCC): the value is OUT, the reference pin is VCC (DS p.2 row 'Voltage Difference (OUT to VCC)'). Cite: DS p.2 header (Notes 1, 2)."
check_pins = ["OUT"]

[param.abs_sense_source]
name       = "Voltage difference SENSE to SOURCE"
kind       = "abs_max"
scope      = "na"
min        = -100
max        = 100
min_ref    = "SOURCE"
max_ref    = "SOURCE"
unit       = "V"
conditions = ""
cite       = "DS p.2, Absolute Maximum Ratings, Voltage Difference (SENSE to SOURCE)"
note       = "Difference V(SENSE) - V(SOURCE): the value is SENSE, the reference pin is SOURCE (DS p.2 row 'Voltage Difference (SENSE to SOURCE)'). Cite: DS p.2 header (Notes 1, 2). SENSE is circuit-set (the sense resistor node), so the row is checked on SENSE with SOURCE as the reference; a module that leaves SOURCE undeclared gets UNVERIFIED (docs/spec/extract.md check-row rules)."
check_pins = ["SENSE"]

[param.abs_fb_tmr]
name       = "FB, TMR voltages"
