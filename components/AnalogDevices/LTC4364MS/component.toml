note       = "Reference: DS p.2 header (Notes 1, 2) and DS p.5, Note 2 ('All voltages are referenced to GND unless otherwise specified'). min_ref/max_ref = GND."
check_pins = ["FB"]
unchecked  = "TMR not checked: timer capacitor node driven by the part; owner: module"

