# LTC4364 surge stopper with ideal diode, MSOP-16 (MS) family: six orderables (C/I/H grade x -1 latch-off / -2 auto-retry),
# listed in variants.toml. Raw datasheet values in printed units (see docs/SPEC.md). Sources: docs/datasheets/ltc4364.pdf,
# LTC4364-1/LTC4364-2 Rev. B (1/23). Rows marked with the DS bullet apply over the full operating temperature range
# (scope "full"); unmarked rows are at TA = 25 degC (scope "25C"). Rows restricted with `variants` are grade or option
# specific (their notes say which). Negative-sign rows: the DS prints them in magnitude order; they are stored in numeric
# order (min <= max), and each row's note records the printed columns.

[part]
value           = "LTC4364MS"                 # family: the MS-package variants are in variants.toml
manufacturer    = "Analog Devices"
description     = "Surge stopper with ideal diode, 4-80 V, MSOP-16 (MS); -1 latch-off or -2 auto-retry, C/I/H grade"
category        = "surge_stopper"
package         = "MSOP-16 (MS), LTC DWG 05-08-1669 Rev A"
datasheet_url   = "https://www.analog.com/media/en/technical-documentation/data-sheets/ltc4364-1-4364-2.pdf"
datasheet_file  = "docs/datasheets/ltc4364.pdf"
datasheet_rev   = "Rev. B"
datasheet_date  = "2023-01"                   # DS p.28, Revision History, B 1/23
kicad_symbol    = "LTC4364MS.kicad_sym"
kicad_footprint = "LTC4364MS.kicad_mod"
step            = "embedded"                  # kicad-embed://LTC4364HMS-1.step in the footprint (embedded name kept from the first import; same MS model for every variant)

# Pins: MS package, DS p.2 Pin Configuration and p.8-9 Pin Functions (MS column). Names and types match the
# symbol LTC4364MS.kicad_sym exactly. No exposed pad in the MS package (DS p.9: pin 15 EP is DE package only).

[[pin]]
number   = "1"
name     = "OUT"
type     = "input"
function = "Output voltage sense input; drain of the external pass MOSFET M1"
cite     = "DS p.8, Pin Functions, OUT (Pin 1 MS)"

[[pin]]
number   = "2"
name     = "SENSE"
type     = "input"
function = "Current sense input; sense resistor from SENSE to OUT"
cite     = "DS p.8, Pin Functions, SENSE (Pin 2 MS)"

[[pin]]
number   = "3"
name     = "NC3"
type     = "no_connect"
function = "No connection, not internally connected; may be tied to GND or any voltage, open increases clearance"
cite     = "DS p.9, Pin Functions, NC (Pins 3 and 7, MS and S packages)"

[[pin]]
number   = "4"
name     = "DGATE"
type     = "output"
function = "Diode controller gate drive output for the ideal diode MOSFET M2"
cite     = "DS p.8, Pin Functions, DGATE (Pin 4 MS)"

[[pin]]
number   = "5"
name     = "SOURCE"
type     = "input"
function = "Common source input and gate drive return; connect to the sources of M1 and M2"
cite     = "DS p.8, Pin Functions, SOURCE (Pin 5 MS)"

[[pin]]
number   = "6"
name     = "HGATE"
type     = "output"
function = "Surge stopper gate drive output for pass MOSFET M1"
cite     = "DS p.8, Pin Functions, HGATE (Pin 6 MS)"

[[pin]]
number   = "7"
name     = "NC7"
type     = "no_connect"
function = "No connection, not internally connected; may be tied to GND or any voltage, open increases clearance"
cite     = "DS p.9, Pin Functions, NC (Pins 3 and 7, MS and S packages)"

[[pin]]
number   = "8"
name     = "VCC"
type     = "power_in"
function = "Positive supply voltage input, 4 V to 80 V normal, -40 V reverse"
cite     = "DS p.9, Pin Functions, VCC (Pin 8 MS)"

[[pin]]
number   = "9"
name     = "SHDN"
type     = "input"
function = "Shutdown control input, active low; open is clamped internally to about 4 V"
cite     = "DS p.9, Pin Functions, SHDN (Pin 9 MS)"

[[pin]]
number   = "10"
name     = "UV"
type     = "input"
function = "Undervoltage comparator input, 1.25 V threshold; connect to SHDN if unused"
cite     = "DS p.8, Pin Functions, UV (Pin 10 MS)"

[[pin]]
number   = "11"
name     = "OV"
type     = "input"
function = "Overvoltage comparator input, 1.25 V threshold; connect to GND if unused"
cite     = "DS p.8, Pin Functions, OV (Pin 11 MS)"

[[pin]]
number   = "12"
name     = "GND"
type     = "power_in"
function = "Device ground"
cite     = "DS p.9, Pin Functions, GND (Pin 12 MS)"

[[pin]]
number   = "13"
name     = "FLT"
type     = "open_collector"
function = "Fault output, open drain, low on fault warning or overcurrent; can sink 2 mA, withstands 80 V"
cite     = "DS p.9, Pin Functions, FLT (Pin 13 MS)"

[[pin]]
number   = "14"
name     = "ENOUT"
type     = "open_collector"
function = "Enable output, open drain, high impedance when OUT is within 0.7 V of VCC; needs pull-up to OUT"
cite     = "DS p.9, Pin Functions, ENOUT (Pin 14 MS)"

[[pin]]
number   = "15"
name     = "TMR"
type     = "passive"
function = "Fault timer input; capacitor to GND sets warning, fault and cool-down times"
cite     = "DS p.9, Pin Functions, TMR (Pin 15 MS)"

[[pin]]
number   = "16"
name     = "FB"
type     = "input"
function = "Voltage regulator feedback input; resistive divider from OUT; GND disables the clamp"
cite     = "DS p.9, Pin Functions, FB (Pin 16 MS)"

# ---------------------------------------------------------------------------------------------------------------
# Absolute Maximum Ratings: DS p.2 (header "ABSOLUTE MAXIMUM RATINGS (Notes 1, 2)", no temperature qualifier).
# ---------------------------------------------------------------------------------------------------------------

[param.abs_vcc]
name       = "Supply voltage VCC"
symbol     = "VCC"
kind       = "abs_max"
scope      = "na"
min        = -40
max        = 100
min_ref    = "GND"
max_ref    = "GND"
unit       = "V"
conditions = ""
cite       = "DS p.2, Absolute Maximum Ratings, Supply Voltage VCC"
note       = "Reference: DS p.2 header (Notes 1, 2) and DS p.5, Note 2 ('All voltages are referenced to GND unless otherwise specified'). min_ref/max_ref = GND."
check_pins = ["VCC"]

[param.abs_source_ov_uv_shdn]
name       = "SOURCE, OV, UV, SHDN voltages"
kind       = "abs_max"
scope      = "na"
min        = -40
max        = 100
min_ref    = "GND"
max_ref    = "GND"
unit       = "V"
conditions = ""
cite       = "DS p.2, Absolute Maximum Ratings, SOURCE, OV, UV, SHDN Voltages"
note       = "Reference: DS p.2 header (Notes 1, 2) and DS p.5, Note 2 ('All voltages are referenced to GND unless otherwise specified'). min_ref/max_ref = GND."
check_pins = ["OV", "UV", "SHDN", "SOURCE"]

[param.abs_dgate_hgate]
name       = "DGATE, HGATE voltages (relative to SOURCE)"
kind       = "abs_max"
scope      = "na"
min        = -0.3
min_ref    = "SOURCE"
max        = 10
max_ref    = "SOURCE"
unit       = "V"
conditions = ""
cite       = "DS p.2, Absolute Maximum Ratings, DGATE, HGATE Voltages (Note 3) SOURCE - 0.3 V to SOURCE + 10 V"
note       = "Note 3 (DS p.5): internal clamps limit DGATE and HGATE to a minimum of 10 V above SOURCE; driving beyond the clamp may damage the device."
unchecked  = "DGATE and HGATE are driven by the part (internally clamped); owner: module"

[param.abs_enout_flt]
name       = "ENOUT, FLT voltages"
kind       = "abs_max"
scope      = "na"
min        = -0.3
max        = 100
min_ref    = "GND"
max_ref    = "GND"
unit       = "V"
conditions = ""
cite       = "DS p.2, Absolute Maximum Ratings, ENOUT, FLT Voltages"
note       = "Conflict inside the DS: abs max row gives 100 V (p.2); pin text DS p.9 says each pin 'can withstand up to 80V', and ILEAK is tested at 80 V (DS p.4). Both stored as printed; the 80 V statement is not an abs max row. Reference: DS p.2 header (Notes 1, 2) and DS p.5, Note 2 ('All voltages are referenced to GND unless otherwise specified'). min_ref/max_ref = GND."
check_pins = ["ENOUT", "FLT"]

[param.abs_out_sense]
name       = "OUT, SENSE voltages"
kind       = "abs_max"
scope      = "na"
min        = -20
max        = 100
min_ref    = "GND"
max_ref    = "GND"
unit       = "V"
conditions = ""
cite       = "DS p.2, Absolute Maximum Ratings, OUT, SENSE Voltages"
note       = "Reference: DS p.2 header (Notes 1, 2) and DS p.5, Note 2 ('All voltages are referenced to GND unless otherwise specified'). min_ref/max_ref = GND."
check_pins = ["OUT", "SENSE"]

[param.abs_sense_out]
name       = "Voltage difference SENSE to OUT"
kind       = "abs_max"
scope      = "na"
min        = -30
max        = 30
min_ref    = "OUT"
max_ref    = "OUT"
unit       = "V"
conditions = ""
cite       = "DS p.2, Absolute Maximum Ratings, Voltage Difference (SENSE to OUT)"
note       = "Difference V(SENSE) - V(OUT): the value is SENSE, the reference pin is OUT (DS p.2 row 'Voltage Difference (SENSE to OUT)'); the row names no reference pin beyond the difference. Cite: DS p.2 header (Notes 1, 2)."
check_pins = ["SENSE"]

[param.abs_out_vcc]
name       = "Voltage difference OUT to VCC"
kind       = "abs_max"
scope      = "na"
min        = -100
max        = 100
