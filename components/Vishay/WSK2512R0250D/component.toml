[part]
value          = "WSK2512R0250D"
mpn            = "WSK2512R0250DEA"           # R0250 = 0.025 ohm, D = +/-0.5 %, EA = lead (Pb)-free tape/reel (DS p.1)
alternates     = ["WSK2512R0250DEK"]         # same part, bulk packaging (EK, DS p.1). BEA (+/-0.1 %) is NOT listed: different tolerance
manufacturer   = "Vishay Dale"               # printed on every DS page header (pp.1-4); matches the symbol's Manufacturer_Name
description    = "0.025 ohm +/-0.5 % 1 W 4-terminal (Kelvin) Power Metal Strip current-sense resistor, 2512"
category       = "current_sense_resistor"
package        = "2512 (4-terminal Kelvin, Power Metal Strip)"
datasheet_url  = "https://www.vishay.com/doc?30108"
datasheet_file = "docs/datasheets/wsk2512.pdf"
datasheet_rev  = "11-Dec-2023 (Document 30108)"
datasheet_date = "2023-12-11"
temp_grade     = "-65 to +170 degC"          # informational; the number lives in a param (operating range, DS p.2)
kicad_symbol    = "WSK2512R0250D.kicad_sym"
kicad_footprint = "WSK2512R0250D.kicad_mod"
step            = "none"                     # no STEP in docs/vendor/WSK2512R0250D (open item)

# No Absolute Maximum Ratings table exists in this datasheet. Ratings are Standard Electrical Specifications (DS p.1)
# and Technical Specifications (DS p.2). Only rows for 0.025 ohm are used.

[[pin]]
number   = "1"
name     = "I2"                            # matches WSK2512R0250D.kicad_sym pin 1 exactly
type     = "passive"                       # matches the symbol
function = "Current connection (I2)"
cite     = "DS p.3, ELECTRICAL CONNECTION, I2 (figure, left terminal outer end) and Notes ('I1 and I2: current connection')"

[[pin]]
number   = "2"
name     = "E2"
type     = "passive"
function = "Voltage sense connection (E2), on the I2 terminal"
cite     = "DS p.3, ELECTRICAL CONNECTION, E2 (figure, left terminal notch) and Notes ('E1 and E2: voltage sense connections')"

[[pin]]
number   = "3"
name     = "E1"
type     = "passive"
function = "Voltage sense connection (E1), on the I1 terminal"
cite     = "DS p.3, ELECTRICAL CONNECTION, E1 (figure, right terminal notch) and Notes ('E1 and E2: voltage sense connections')"

[[pin]]
number   = "4"
name     = "I1"
type     = "passive"
function = "Current connection (I1)"
cite     = "DS p.3, ELECTRICAL CONNECTION, I1 (figure, right terminal outer end) and Notes ('I1 and I2: current connection')"

[param.r_nom]
name       = "Resistance, nominal"
symbol     = "R"
kind       = "electrical"
scope      = "na"
typ        = 0.025
unit       = "ohm"
conditions = ""
cite       = "DS p.1, Global Part Number Information, resistance code R0250 (R = decimal rule, example R0100 = 0.01 ohm)"
note       = "Value decoded from the part number by the printed decimal rule (R0100 = 0.01 ohm is the printed example); no table row prints 0.025 ohm. Stored as typ only."

[param.tol]
name       = "Resistance tolerance, code D"
symbol     = "TOL"
kind       = "electrical"
scope      = "na"
min        = -0.5
max        = 0.5
unit       = "%"
conditions = ""
cite       = "DS p.1, Standard Electrical Specifications, TOL. +/-0.5 % column; DS p.1, Global Part Number Information, tolerance code D = +/-0.5 %"
note       = "The DS does not state the reference temperature for the tolerance."

[param.r_range_tol05]
name       = "Resistance value range, +/-0.5 % tolerance"
kind       = "electrical"
scope      = "na"
min        = 0.001
max        = 0.2
unit       = "ohm"
conditions = ""
cite       = "DS p.1, Standard Electrical Specifications, Resistance value range TOL. +/-0.5 % column, 0.001 to 0.2 row"
note       = "Confirms 0.025 ohm is in range for code D. The +/-0.1 % range (0.01 to 0.2 ohm) also covers 0.025 ohm; the +/-1.0 % range is 0.0005 to 0.2 ohm."

[param.tcr]
name       = "Temperature coefficient of resistance"
symbol     = "TCR"
kind       = "electrical"
scope      = "na"
min        = -35
max        = 35
unit       = "ppm/degC"
conditions = "Resistance range 0.005 ohm to 0.2 ohm (covers 0.025 ohm)"
cite       = "DS p.2, Technical Specifications, Temperature coefficient (RESISTOR CHARACTERISTICS), +/-35 for 0.005 ohm to 0.2 ohm"
note       = "DS p.1 Features says 'low TCR (< 20 ppm/degC)'. Feature text is not a specification; the table value +/-35 is used (open item). The DS states neither the reference temperature nor the temperature span over which the TCR holds."

[param.p70]
name       = "Power rating at 70 degC ambient"
symbol     = "P70 degC"
kind       = "rec_op"
scope      = "na"
max        = 1.0
unit       = "W"
conditions = "Ambient 70 degC; 0.025 ohm lies in the 0.01 to 0.2 ohm and 0.001 to 0.2 ohm ranges"
cite       = "DS p.1, Standard Electrical Specifications, POWER RATING P70 degC, W, 1.0"
note       = "Rating: a maximum, stored as max. No abs-max table. Rated against AMBIENT (DS p.3 DERATING axis); self-heating is not given."
unchecked  = "dissipation depends on the load current; owner: module (calc.dissipation vs calc.rated_power)"

[param.max_working_voltage]
name       = "Maximum working voltage"
kind       = "rec_op"
scope      = "na"
text       = "(P x R)^1/2"
unit       = "V"
conditions = ""
cite       = "DS p.2, Technical Specifications, Maximum working voltage, (P x R)^1/2"
note       = "Formula, not a number. calc.py max_working_voltage implements it."
unchecked  = "formula rating; owner: module (calc.max_working_voltage)"

[param.t_oper]
name       = "Operating temperature range"
kind       = "rec_op"
scope      = "na"
min        = -65
max        = 170
unit       = "degC"
conditions = ""
cite       = "DS p.2, Technical Specifications, Operating temperature range, -65 to +170"
note       = "The DS does not say whether this is ambient or element temperature; read as ambient (DS p.3 DERATING axis). Only temperature rating in the DS (no storage or abs-max row)."
check_ambient = true

[param.derate_knee]
name       = "Derating knee: 100 % rated power up to"
symbol     = "TA knee"
kind       = "rec_op"
scope      = "na"
typ        = 70
unit       = "degC"
conditions = ""
cite       = "DS p.3, Figure: DERATING graph (unnumbered; rated power vs ambient, 100 % line ends at 70 degC); coincides with DS p.1 P70 degC"
curve      = true
note       = "Read off the graph. Not a worst-case bound (curve)."
unchecked  = "curve value; used by calc.rated_power"

[param.derate_zero]
name       = "Derating: 0 % rated power at"
symbol     = "TA zero"
kind       = "rec_op"
scope      = "na"
typ        = 170
unit       = "degC"
conditions = ""
cite       = "DS p.3, Figure: DERATING graph (unnumbered; rated power vs ambient, line reaches 0 % at 170 degC)"
curve      = true
note       = "Read off the graph (no printed number). Coincides with the top of the operating range (DS p.2). Linear between knee and zero (graph shape)."

# Performance test limits (DS p.3, PERFORMANCE, TEST LIMITS), printed as "± X % + 0.0005 ohm".
# Total limit for each row: ±(X % of R + 0.0005 ohm). The percent term is stored as min = -X, max = X; the additive
# 0.0005 ohm is stored once in perf_offset_ohm (the printed "+" is one-sided, so it is max only).
# The DS gives no end-of-life guarantee outside these conditions; typical performance is better (DS p.3 note).
unchecked  = "curve value; used by calc.rated_power"

[param.perf_offset_ohm]
name       = "Performance test limit, additive term (all PERFORMANCE rows)"
kind       = "electrical"
scope      = "na"
max        = 0.0005
unit       = "ohm"
conditions = "Added to the percent term of every PERFORMANCE row: total limit ±(X % of R + 0.0005 ohm)"
cite       = "DS p.3, PERFORMANCE, TEST LIMITS column, '+ 0.0005 ohm' (all rows)"
note       = "One-sided printed term. Reading: the ± on each row applies to the percent term only."

[param.perf_thermal_shock]
name       = "Resistance change, thermal shock"
kind       = "electrical"
scope      = "na"
min        = -0.5
max        = 0.5
unit       = "%"
conditions = "-55 degC to +150 degC, 1000 cycles, 15 min at each extreme"
cite       = "DS p.3, PERFORMANCE, Thermal shock, TEST LIMITS"
note       = "Printed ± 0.5 %. Total limit ±(0.5 % of R + 0.0005 ohm); add perf_offset_ohm."

[param.perf_short_time_overload]
name       = "Resistance change, short time overload"
