# Open item: no pin-1 marker in the vendor footprint (none added; the part is symmetric about its centre); check the orientation in KiCad.
[part]
value          = "WSK2512-LOW"
series         = "resistor"                  # value and tolerance are design inputs; calc.mpn(value, tol_code) gives the part number
value_param    = "res_range"                 # directory range (below); each tolerance range is clipped to it
e_series       = ["VISHAY-DECADE"]           # two significant digits 10..99 per decade (Vishay Dale doc 30117, lib/series.py)
series_eseries_min = { VISHAY-DECADE = 0.001 }  # sub-1 mohm excluded: the DS prints no value code below 1 mohm (5L000, R0100 only); the "L5000" form is unconfirmed (open item)
series_power   = "p70"
series_pins    = ["I1", "I2"]               # 4-terminal part: rated voltage is checked across the current terminals I1 and I2 (E1, E2 sense the same terminals)
# No series_vlimit: the DS prints no limiting element voltage, rated voltage is (P x R)^1/2 (DS p.2).
series_tolerances = { D = { tol = "tol_d", range = "r_range_d" }, F = { tol = "tol_f", range = "r_range_f" } }   # code -> tolerance row + resistance range row
series_tcr     = [{ tcr = "tcr_500u_990u", range = "tcr_500u_990u_range" }, { tcr = "tcr_1m_2m9", range = "tcr_1m_2m9_range" }, { tcr = "tcr_3m_4m9", range = "tcr_3m_4m9_range" }]   # TCR row + the range it applies to; Part.tcr(value) picks the row
alternates     = []                          # EK (bulk) is the same part in other packaging (DS p.1) but the wrapper has no per-value alternates: open item
manufacturer   = "Vishay Dale"               # printed on every DS page header (pp.1-4)
description    = "0.0005 to 0.0049 ohm (decade values) +/-0.5 % / +/-1.0 % 1 W 4-terminal (Kelvin) Power Metal Strip current-sense resistor series, 2512"
category       = "current_sense_resistor"
package        = "2512 (4-terminal Kelvin, Power Metal Strip)"
datasheet_url  = "https://www.vishay.com/doc?30108"
datasheet_file = "docs/datasheets/wsk2512.pdf"
datasheet_rev  = "11-Dec-2023 (Document 30108)"
datasheet_date = "2023-12-11"
temp_grade     = "-65 to +170 degC"          # informational; the number lives in a param (operating range, DS p.2)
kicad_symbol    = "WSK2512-LOW.kicad_sym"
kicad_footprint = "WSK2512-LOW.kicad_mod"
step            = "none"                     # no STEP in docs/vendor (open item)

# Series of the WSK2512 model for 0.0005 to 0.0049 ohm (value set: decade table, Vishay Dale document 30117, "WSL Type
# Resistors"; the WSK datasheet does not reference that table: open item). The single part WSK2512R0250D stays a
# separate directory; its value (0.025 ohm, code D) is also reachable through components/Vishay/WSK2512.
# No Absolute Maximum Ratings table exists in this datasheet. Ratings are Standard Electrical Specifications (DS p.1)
# and Technical Specifications (DS p.2).

[[pin]]
number   = "1"
name     = "I2"                            # matches WSK2512R0250D.kicad_sym pin 1 exactly
type     = "passive"                       # matches the symbol
function = "Current connection (I2)"
cite     = "DS p.3, ELECTRICAL CONNECTION, I2 (figure, left terminal outer end) and Notes ('I1 and I2: current connection')"

[[pin]]
number   = "2"
name     = "E2"
type     = "passive"
function = "Voltage sense connection (E2), on the I2 terminal"
cite     = "DS p.3, ELECTRICAL CONNECTION, E2 (figure, left terminal notch) and Notes ('E1 and E2: voltage sense connections')"

[[pin]]
number   = "3"
name     = "E1"
type     = "passive"
function = "Voltage sense connection (E1), on the I1 terminal"
cite     = "DS p.3, ELECTRICAL CONNECTION, E1 (figure, right terminal notch) and Notes ('E1 and E2: voltage sense connections')"

[[pin]]
number   = "4"
name     = "I1"
type     = "passive"
function = "Current connection (I1)"
cite     = "DS p.3, ELECTRICAL CONNECTION, I1 (figure, right terminal outer end) and Notes ('I1 and I2: current connection')"

