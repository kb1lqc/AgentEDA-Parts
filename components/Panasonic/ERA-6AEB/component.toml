# Series component: the resistance VALUE is a design input (47 to 1 M ohm, E24/E96), not fixed.
# Source: Panasonic Fixed Resistors catalog 2026.5 (docs/datasheets/panasonic-fixed-resistors-catalog-2026-05.pdf),
# "Metal Film (Thin Film) Chip Resistors, High Reliability Type", ERA A type, EB grade (+/-0.1 %, T.C.R. +/-25 ppm/degC).
# The catalog prints no Absolute Maximum Ratings table for this type. Its ratings are the Ratings table (rec_op,
# printed p.20) and the Performance table (electrical, printed p.21). Rating rows are value-dependent and checked per series wrapper.
#
# Part-number decode (DS p.19, Explanation of part numbers, E24 and E96 blocks), size 0805:
#   1-3  E R A   thin film chip resistor (product code)
#   4-5  size code (DS p.19 Size, Power rating table); power rating 0.125 W at 85 degC
#   6    E       T.C.R. code E = +/-25 ppm/degC (DS p.19)
#   7    B       resistance tolerance code B = +/-0.1 % (DS p.19)
#   8-10 E24: three figures, first two significant, third = number of zeros (470 = 47 ohm, 102 = 1 kohm)
#        E96: four figures, first three significant, fourth = number of zeros (1051 = 1.05 kohm)
#   last V      packaging: Punched carrier taping, 4 mm pitch, 5,000 pcs (code V, ERA6A row)
# DS note *5: a value that is also an E24 value follows the E24 part number (three-digit code).
# E192 values are 'available, please contact us' (DS note *4): not in this format (open item).
# mpn is CONSTRUCTED from this rule; the catalog prints no example for this size's EB part.
# series_eseries_min: E96 is allowed from 100 ohm only. DS p.19 (Explanation of part numbers): E96 code = three
# significant figures + number of zeros; no decimal-point ("R") rule is printed, so E96 values below 100 ohm that are
# not E24 values (47.5 to 97.6 ohm) have no printed code and are excluded (open item). E24 values from 47 ohm stay.

[part]
value          = "ERA-6AEB"
series          = "resistor"                 # value is a design input; calc.mpn(value) gives the part number
value_param     = "res_range"
series_eseries_min = { E96 = 100 }            # DS p.19: E96 code = 3 significant figures + zeros; no decimal-point rule printed, so E96 below 100 ohm is excluded (open item)
e_series        = ["E24", "E96"]              # DS p.20 Ratings, resistance range '(E24,E96)'; E192 by request only
series_power    = "p85"
series_vlimit   = "v_limit"
series_tol      = "tol"
alternates      = []                          # DS packaging table lists this size's EB part under one code only
manufacturer    = "Panasonic"                 # printed on every catalog page header (Panasonic Industry)
description    = "0805 (2012 metric) 0.125 W +/-0.1 % +/-25 ppm/degC thin film chip resistor, ERA-6AEB (47 to 1 M ohm, E24/E96)"
category       = "resistor_thin_film"
package        = "0805 (2012 metric)"
datasheet_url  = ""                         # open item: the catalog prints no datasheet URL; datasheet_file is the source
datasheet_file = "docs/datasheets/panasonic-fixed-resistors-catalog-2026-05.pdf"
datasheet_rev  = "Catalog 2026.5 (ERA A pages: footer 24-Apr-24, printed pp.19-21)"
datasheet_date = "2026-05"                 # from the catalog file name; no date is printed on the pages
temp_grade     = "-55 to 155 degC"           # informational; the number lives in param category_temp (DS p.20)
kicad_symbol    = "ERA-6AEB.kicad_sym"          # vendor (Ultra Librarian) symbol, fixed up
kicad_footprint = "ERA-6AEB.kicad_mod"          # vendor N footprint, pads from DMM0000COL17 (middle of each land range)
step            = "ERA-6AEB.step"               # Panasonic model via Ultra Librarian (generic 0.711 mm height vs DS T 0.50 +/-0.10: visual only)

[[pin]]
number   = "1"
name     = "1"
type     = "passive"
function = "Resistor terminal"
cite     = "DS p.21, Construction (figure; no pin drawing or pin table in this catalog)"

[[pin]]
number   = "2"
name     = "2"
type     = "passive"
function = "Resistor terminal"
cite     = "DS p.21, Construction (figure; no pin drawing or pin table in this catalog)"

# ---- Ratings: ERA6AEB row of the Ratings table (DS p.20). ----

[param.p85]
name       = "Power rating at 85 degC"
symbol     = "P85"
kind       = "rec_op"
scope      = "na"
max        = 0.125
unit       = "W"
conditions = "Ambient 85 degC; use on the condition that the case temperature is below the upper category temperature (footnote *1)"
cite       = "DS p.20, Ratings, Power rating (85 degC) (W), ERA6AEB row"
note       = "Printed 0.125 W for this size (DS p.20). Printed with no MIN/TYP/MAX label: stored as max (Defaults table). Derated above 85 degC (derate_knee, derate_zero)."
unchecked  = "series_power: used by the wrapper rated_voltage check (85 degC rating, optimistic above 85 degC ambient)"

[param.v_limit]
name       = "Limiting element voltage"
symbol     = "V limit"
kind       = "rec_op"
scope      = "na"
max        = 100
unit       = "V"
conditions = ""
cite       = "DS p.20, Ratings, Limiting element voltage (V), ERA6AEB row"
note       = "Upper limit on RCWV (footnote *2): RCWV = sqrt(Power rating x Resistance value) or this limit, whichever is less. See rcwv_rule."
unchecked  = "series_vlimit: used by the wrapper rated_voltage check"

[param.v_overload]
name       = "Maximum overload voltage"
symbol     = "V overload"
kind       = "rec_op"
scope      = "na"
max        = 200
unit       = "V"
conditions = ""
cite       = "DS p.20, Ratings, Maximum overload voltage (V), ERA6AEB row"
note       = "Upper limit on the overload test voltage (footnote *3): OTV = 2.5 x RCWV or this limit, whichever is less. The Performance table (p.21) prints the overload test as rated voltage x 2.5, 5 s."
unchecked  = "overload test voltage (short-time test condition), not an operating limit; owner: module"

[param.rcwv_rule]
name       = "Rated continuous working voltage, RCWV"
symbol     = "RCWV"
kind       = "rec_op"
scope      = "na"
text       = "sqrt(Power rating x Resistance value), or limiting element voltage, whichever less"
unit       = "V"
conditions = ""
cite       = "DS p.20, Ratings, footnote *2"
note       = "Formula, not a number. calc.py rated_voltage implements it."
unchecked  = "formula rating; owner: module (calc.rated_voltage)"

[param.category_temp]
name       = "Category temperature range"
symbol     = "T category"
kind       = "rec_op"
scope      = "na"
min        = -55
max        = 155
unit       = "degC"
conditions = ""
cite       = "DS p.20, Ratings, Category temperature range (degC), all rows of the table (also DS p.19 Features)"
note       = "Read as ambient, the axis of the derating figure (DS p.20). Ratings are for the case temperature below this limit (footnote *1)."
check_ambient = true

[param.derate_knee]
name       = "Derating knee: full rated power up to"
symbol     = "TA knee"
kind       = "rec_op"
scope      = "na"
typ        = 85
unit       = "degC"
conditions = ""
cite       = "DS p.20, Power derating curve (text: 'above 85 degC, power rating shall be derated')"
note       = "Printed in the text, not read off the graph. Used by calc.rated_power."
unchecked  = "derating knee (printed in text, not a limit); used by calc.rated_power"

[param.derate_zero]
name       = "Derating: 0 % rated power at"
symbol     = "TA zero"
kind       = "rec_op"
scope      = "na"
typ        = 155
unit       = "degC"
conditions = ""
cite       = "DS p.20, Power derating curve (figure: the derating line reaches 0 % at the 155 degC label)"
curve      = true
note       = "Read off the graph (no printed number). Linear between knee and zero (graph shape). Curve-based estimate; reading uncertainty not quantified (open item)."
unchecked  = "curve value; used by calc.rated_power"

