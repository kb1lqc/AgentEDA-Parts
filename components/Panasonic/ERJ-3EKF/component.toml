# Series component: the resistance VALUE is a design input (10 ohm to 1 Mohm, E24/E96), not fixed.
# Ratings are the ERJ3EK row of the "Ratings <+/-1 %>" table (DS PDF p.3), K-coded +/-1 % (F) part.
# The DS has NO Absolute Maximum Ratings table. Its ratings are the Ratings table (rec_op) and the
# Performance test limits (electrical). Rating rows are value-dependent and checked per series wrapper.
#
# Part-number decode (DS PDF p.2, "Explanation of part numbers", +/-1 % block), 12 characters:
#   1-3  E R J   thick film chip resistor (product code)
#   4-6  3 E K   size code 3EK = 0603 (1608 metric), 0.1 W (the K is part of the size code in this block)
#   7    F       resistance tolerance code F = +/-1 %
#   8-11 1002    resistance value: first three digits significant, last digit = number of zeros (1002 = 10 kohm).
#                Decimal point is "R" (DS p.2 text). The DS prints NO example of an R-decimal code.
#   12   V       packaging: punched carrier taping, 4 mm pitch, 5,000 pcs (DS p.2 packaging table, ERJ3EK listed)
# mpn is CONSTRUCTED: the DS prints no ERJ3EKF example (its only printed example is ERJ8ENF1002V, another series).
# The DS prints part numbers without a hyphen ("ERJ3EK"), so the hyphen is dropped in mpn.

[part]
value          = "ERJ-3EKF"
series          = "resistor"                 # value is a design input; calc.mpn(value) gives the part number
value_param     = "res_range"
e_series        = ["E24", "E96"]              # DS p.3 Ratings: resistance range "10 to 1 M (E24, E96)"
series_power    = "p70"
series_vlimit   = "v_limit"
series_tol      = "tol"
alternates     = []                          # DS packaging table lists ERJ3EK only under V
manufacturer   = "Panasonic"                 # printed on every DS page header (Panasonic Industry)
description    = "0603 (1608 metric) 0.1 W +/-1 % thick film chip resistor, ERJ-3EKF series (10 ohm to 1 Mohm, E24/E96)"
category       = "resistor_thick_film"
package        = "0603 (1608 metric)"
datasheet_url  = "https://industrial.panasonic.com/cdbs/www-data/pdf/RDA0000/AOA0000C304.pdf"   # NOT printed in the PDF: unverified, as instructed
datasheet_file = "docs/datasheets/AOA0000C304.pdf"
datasheet_rev  = "29-May-25 (page footers, pp.1-4)"    # printed footer date on each page; no separate revision letter printed
datasheet_date = "2025-05-29"
temp_grade     = "-55 to 155 degC"           # informational; the number lives in param category_temp (DS PDF p.3, Ratings)
kicad_symbol    = "ERJ-3EKF.kicad_sym"       # vendor (Ultra Librarian) symbol, fixed up
kicad_footprint = "ERJ-3EKF.kicad_mod"       # vendor N footprint, pads per Panasonic DMM0000COL17 land pattern
step            = "ERJ-3EKF.step"            # Panasonic model via Ultra Librarian (docs/vendor/ERJ-3EKF/), copied unchanged
# OPEN ITEM: the STEP is 0.711 mm tall vs DS thickness T 0.45 mm (DS p.4 Dimensions); length and width match.
# Use it for visual checks only, not for height or clearance checks.

[[pin]]
number   = "1"
name     = "1"
type     = "passive"
function = "Resistor terminal"
cite     = "DS PDF p.3, Construction (figure; no pin drawing or pin table in this datasheet)"

[[pin]]
number   = "2"
name     = "2"
type     = "passive"
function = "Resistor terminal"
cite     = "DS PDF p.3, Construction (figure; no pin drawing or pin table in this datasheet)"

