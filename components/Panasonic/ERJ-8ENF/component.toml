# Series component: the resistance VALUE is a design input (10 ohm to 2.2 Mohm, E24/E96), not fixed.
# Source: Panasonic "Fixed Resistors" products catalog, 2026.5 (docs/datasheets/panasonic-fixed-resistors-catalog-2026-05.pdf),
# "Precision Thick Film Chip Resistors", printed pp.9-11 (PDF pp.11-13). Ratings are the ERJ8EN row of the
# "Ratings <+/-1 %>" table (printed p.10). The catalog has NO Absolute Maximum Ratings table. Its ratings are the Ratings
# table (rec_op) and the Performance test limits (electrical). Rating rows are value-dependent and checked per series wrapper.
#
# LIFECYCLE: the catalog marks ERJ8EN "NRFND" (Not recommended for new design) on printed pp.9, 10 and 11 (its row is greyed
# in every table). Data are entered as printed. Lifecycle is an open item: not checked (no web access).
#
# Part-number decode (catalog printed p.9, "Explanation of part numbers", +/-1 % block), 12 characters:
#   1-3  E R J   thick film chip resistor (product code)
#   4-6  8 E N   size code 8EN = 1206 (3216 metric), 0.25 W (the N is part of the size code in this block)
#   7    F       resistance tolerance code F = +/-1 %
#   8-11 1002    resistance value: first three digits significant, last digit = number of zeros (1002 = 10 kohm).
#                Decimal point is "R" (catalog p.9 text). The catalog prints NO example of an R-decimal code.
#   12   V       packaging: punched carrier taping, 4 mm pitch, 5,000 pcs (catalog p.9 packaging table, ERJ8EN listed under V, NRFND)
# mpn is CONSTRUCTED: the catalog prints no ERJ8ENF part number (its only printed example is 1002 -> 10 kohm).
# The catalog prints part numbers without a hyphen ("ERJ8EN"), so the hyphen is dropped in mpn.

[part]
value          = "ERJ-8ENF"
series          = "resistor"                 # value is a design input; calc.mpn(value) gives the part number
value_param     = "res_range"
e_series        = ["E24", "E96"]              # catalog p.10 Ratings <+/-1 %>: resistance range "10 to 2.2 M (E24,E96)"
series_power    = "p70"
series_vlimit   = "v_limit"
series_tol      = "tol"
alternates     = []                          # catalog packaging table lists ERJ8EN only under V (no other packaging)
manufacturer   = "Panasonic"                 # printed on every catalog page header (Panasonic Industry)
description    = "1206 (3216 metric) 0.25 W +/-1 % thick film chip resistor, ERJ-8ENF series (10 ohm to 2.2 Mohm, E24/E96); NRFND"
category       = "resistor_thick_film"
package        = "1206 (3216 metric)"
datasheet_url  = ""                         # open item: the catalog prints no datasheet URL; datasheet_file is the source
datasheet_file = "docs/datasheets/panasonic-fixed-resistors-catalog-2026-05.pdf"
datasheet_rev  = "Products catalog 2026.5; page footers dated 29-May-25 (printed pp.8-11)"
datasheet_date = "2025-05-29"
temp_grade     = "-55 to 155 degC"           # informational; the number lives in param category_temp (catalog p.10, Ratings)
kicad_symbol    = "ERJ-8ENF.kicad_sym"       # vendor (Ultra Librarian) symbol, fixed up
kicad_footprint = "ERJ-8ENF.kicad_mod"       # vendor N footprint, pads from DMM0000COL17 (middle of each land range)
step            = "ERJ-8ENF.step"            # Panasonic model via Ultra Librarian (generic 0.711 mm height: visual only)
# Land pattern: not in the catalog; from DMM0000COL17 (land_a/b/c rows); footprint pads 1.25 x 1.5 mm at +/-1.725 mm.
# OPEN ITEM: NRFND (see LIFECYCLE above). Confirm availability and whether a successor is preferred before use in a new design.

[[pin]]
number   = "1"
name     = "1"
type     = "passive"
function = "Resistor terminal"
cite     = "DS p.10, Construction (figure; no pin drawing or pin table in this datasheet)"

[[pin]]
number   = "2"
name     = "2"
type     = "passive"
function = "Resistor terminal"
cite     = "DS p.10, Construction (figure; no pin drawing or pin table in this datasheet)"

# ---- Ratings: ERJ8EN row of the "Ratings <+/-1 %>" table (catalog printed p.10; row printed grey, NRFND). ----

[param.p70]
name       = "Rated power at 70 degC"
symbol     = "P70"
kind       = "rec_op"
scope      = "na"
max        = 0.25
unit       = "W"
conditions = "Ambient 70 degC; use with case temperature below the upper category temperature (footnote *1)"
cite       = "DS p.10, Ratings <+/-1 %>, Power rating (70 degC) (W), ERJ8EN row"
note       = "The catalog prints 0.25 W for ERJ8EN. Printed with no MIN/TYP/MAX label: stored as max (Defaults table). Derated above 70 degC (derate_knee, derate_zero). No abs-max table in this catalog. NRFND row."
unchecked  = "series_power: used by the wrapper rated_voltage check (70 degC rating, optimistic above 70 degC ambient)"

[param.v_limit]
name       = "Limiting element voltage"
symbol     = "V limit"
kind       = "rec_op"
scope      = "na"
max        = 200
unit       = "V"
conditions = ""
cite       = "DS p.10, Ratings <+/-1 %>, Limiting element voltage (V), ERJ8EN row"
note       = "Upper limit on RCWV (footnote *2): RCWV = sqrt(Power rating x Resistance value) or this limit, whichever is less. See rcwv_rule."
unchecked  = "series_vlimit: used by the wrapper rated_voltage check"

[param.v_overload]
name       = "Maximum overload voltage"
symbol     = "V overload"
kind       = "rec_op"
scope      = "na"
max        = 400
unit       = "V"
conditions = ""
cite       = "DS p.10, Ratings <+/-1 %>, Maximum overload voltage (V), ERJ8EN row"
note       = "Upper limit on the overload test voltage (footnote *3): OTV = specified magnification x RCWV or this limit, whichever is less."
unchecked  = "overload test voltage (short-time test condition), not an operating limit; owner: module"

[param.rcwv_rule]
name       = "Rated continuous working voltage, RCWV"
symbol     = "RCWV"
kind       = "rec_op"
scope      = "na"
text       = "sqrt(Power rating x Resistance value), or limiting element voltage, whichever less"
unit       = "V"
conditions = ""
cite       = "DS p.10, Ratings <+/-1 %>, footnote *2"
note       = "Formula, not a number. calc.py rated_voltage implements it."
unchecked  = "formula rating; owner: module (calc.rated_voltage)"

[param.category_temp]
name       = "Category temperature range"
symbol     = "T category"
kind       = "rec_op"
scope      = "na"
min        = -55
max        = 155
unit       = "degC"
conditions = ""
cite       = "DS p.10, Ratings <+/-1 %>, Category temperature range (degC), ERJ8EN row (merged cell with ERJ2RK, ERJ3EK, ERJ6EN; NRFND rows greyed)"
note       = "Read as ambient, the axis of the derating figure (DS p.10). Ratings are for the case temperature below this limit (footnote *1)."
check_ambient = true

[param.derate_knee]
name       = "Derating knee: full rated power up to"
symbol     = "TA knee"
kind       = "rec_op"
scope      = "na"
typ        = 70
unit       = "degC"
conditions = ""
cite       = "DS p.10, Power derating curve (text: 'above 70 degC, power rating shall be derated')"
note       = "Printed in the text, not read off the graph. Used by calc.rated_power."
unchecked  = "derating knee (printed in text, not a limit); used by calc.rated_power"

[param.derate_zero]
name       = "Derating: 0 % rated power at"
symbol     = "TA zero"
kind       = "rec_op"
scope      = "na"
typ        = 155
unit       = "degC"
conditions = ""
cite       = "DS p.10, Power derating curve (figure: the 155 degC line reaches 0 %)"
curve      = true
note       = "Read off the graph (no printed number). The 155 degC line is used because this part's category range is -55 to +155 degC; the steeper 125 degC line is labelled ERJXG,1G,1R. Linear between knee and zero (graph shape). Curve-based estimate; reading uncertainty not quantified (open item)."
unchecked  = "curve value; used by calc.rated_power"

# ---- Resistance and tolerance ----

[param.tol]
name       = "Resistance tolerance, code F"
symbol     = "TOL"
kind       = "electrical"
scope      = "na"
min        = -1
max        = 1
unit       = "%"
conditions = "Resistance measured at 20 degC (catalog p.11, Performance <+/-1 %> (F), Resistance row)"
cite       = "DS p.10, Ratings <+/-1 %>, Resistance tolerance (%), ERJ8EN row; DS p.9, tolerance code F = +/-1 %"
note       = "Reference temperature 20 degC from the Performance table; the T.C.R. test runs from +25 degC (DS p.11)."

[param.res_range]
name       = "Resistance range"
kind       = "electrical"
scope      = "na"
min        = 10
max        = 2200000
unit       = "ohm"
conditions = "E24, E96 values"
cite       = "DS p.10, Ratings <+/-1 %>, Resistance range (ohm), ERJ8EN row '10 to 2.2 M'"
note       = "Printed '10 to 2.2 M' in the ohm column; 2.2 M is written out as 2200000 ohm. Values below 100 ohm use the R decimal code (DS p.9), see calc.mpn. NRFND row."

[param.tcr_10r_2m2]
name       = "Temperature coefficient of resistance, 10 ohm to 2.2 Mohm"
symbol     = "TCR"
kind       = "electrical"
scope      = "na"
min        = -100
max        = 100
unit       = "ppm/degC"
conditions = "Resistance 10 ohm to 2.2 Mohm; T.C.R. test at +25 degC / +155 degC (DS p.11, Performance <+/-1 %> (F), T. C. R. row)"
cite       = "DS p.10, Ratings <+/-1 %>, T.C.R. (x10-6/K), ERJ8EN row (+/-100, one value for the whole +/-1 % range)"
note       = "Printed +/-100 x10-6/K (= ppm/degC): stored as min = -100, max = 100. One TCR for the full +/-1 % range (the catalog's single +/-100 cell covers ERJ2RK through ERJ1TN). The catalog does not state the TCR reference temperature. Use this key for any value in 10 ohm to 2.2 Mohm."

