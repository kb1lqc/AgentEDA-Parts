[param.vds_rating]
name       = "Drain-source voltage rating"
symbol     = "VDS"
kind       = "rec_op"
scope      = "na"
max        = 100
unit       = "V"
conditions = ""
cite       = "DS p.1, Table 1 Key performance parameters, VDS"
verified   = "human:kb1lqc 2026-11-24 page-image ds_review 7e144939b785 row 5e489e72c156"
note       = "Not a row of the Maximum ratings table (DS p.3). The DS gives no temperature for it. The guaranteed minimum breakdown voltage is V(BR)DSS = 100 V at 25 degC (vbr_dss, DS p.5 Table 4). Printed with no MIN/TYP/MAX label: stored as max. Only the upper bound is checked."
check_pins = ["D"]
max_ref    = "S"

