# ISC035N10NM5LF2: 100 V N-channel OptiMOS 5 Linear FET 2, PG-TDSON-8-59. Source: docs/datasheets/infineon/
# infineon-isc035n10nm5lf2-datasheet-en.pdf, Final datasheet Revision 2.3, 2025-11-07. Raw datasheet values in printed units.
# Electrical rows are at Tj = 25 degC (DS p.5, "at Tj=25 degC, unless otherwise specified") and carry scope "25C".
# Rows with a single stated temperature in their own condition (Tj = 125 degC, TC = 25 degC) carry scope "na".
# Charge (nC) and energy (mJ) rows are loaded: lib/units.py accepts C and J (coordinator, this revision).
# Open item: Diagram 3 (TC = 25 degC) 100 ms and DC lines are one merged trace at 40-80 V in the render; no rows for them.
# Diagram 3 10 us: rows at 50 and 80 V only (merged with 1 us or label at 20-40 V).
# Open item: 10 us line in Diagram 4 is hidden under its label at 50 V; Diagram 3 1 us and 10 us near 5 V sit on corner rounding (no rows).
[part]
value           = "ISC035N10NM5LF2"
mpn             = "ISC035N10NM5LF2"            # DS p.1 Part number prints the type name only; no reel suffix printed (open item)
# Unverified: the user's vendor downloads are named ISC035N10NM5LF2ATMA1. The DS prints no suffix, so mpn stays the type name.
manufacturer    = "Infineon Technologies"
description     = "100 V N-channel OptiMOS 5 Linear FET 2 (hot swap / e-fuse), 164 A, 3.5 mohm max, PG-TDSON-8-59"
category        = "mosfet"
package         = "PG-TDSON-8-59"
datasheet_url   = "https://www.infineon.com"  # DS prints the site only, not a part-specific URL (open item)
datasheet_file  = "docs/datasheets/infineon/infineon-isc035n10nm5lf2-datasheet-en.pdf"
datasheet_rev   = "Revision 2.3"
datasheet_date  = "2025-11-07"                 # DS p.1 footer
temp_grade      = "-55 to 175 degC"            # informational: Tj,Tstg range (DS p.3 Table 2), a junction range
kicad_symbol    = "ISC035N10NM5LF2.kicad_sym"
kicad_footprint = "ISC035N10NM5LF2.kicad_mod"
step            = "ISC035N10NM5LF2.step"
# Lead finish: "Pb-free lead plating; RoHS compliant" (DS p.1 Features). MSL: not printed in the DS (open item).

# Pins: DS p.1 pin diagram (PG-TDSON-8). Pins 1-3 source, pin 4 gate, pins 5-8 drain. The diagram prints the drain
# label as "Pin 5-8, tab": the tab (exposed drain pad) has NO printed number, so there is no pin for it (open item).
# Discrete transistor: S, D and G are passive terminals (function text states it).

[[pin]]
number   = "1"
name     = "S"
type     = "passive"
function = "Source, discrete MOSFET terminal; pins 1 to 3 are one source node (DS p.1 pin diagram 'Source Pin 1-3')"
cite     = "DS p.1, pin diagram (PG-TDSON-8), Source Pin 1-3"

[[pin]]
number   = "2"
name     = "S"
type     = "passive"
function = "Source, discrete MOSFET terminal; same source node as pin 1"
cite     = "DS p.1, pin diagram (PG-TDSON-8), Source Pin 1-3"

[[pin]]
number   = "3"
name     = "S"
type     = "passive"
function = "Source, discrete MOSFET terminal; same source node as pin 1"
cite     = "DS p.1, pin diagram (PG-TDSON-8), Source Pin 1-3"

[[pin]]
number   = "4"
name     = "G"
type     = "passive"
function = "Gate, discrete MOSFET terminal (DS p.1 pin diagram 'Gate Pin 4')"
cite     = "DS p.1, pin diagram (PG-TDSON-8), Gate Pin 4"

[[pin]]
number   = "5"
name     = "D"
type     = "passive"
function = "Drain, discrete MOSFET terminal; pins 5 to 8 and the tab are one drain node (DS p.1 'Drain Pin 5-8, tab'). The drain tab (exposed pad) has no DS number and is not a separate pin: the footprint makes it pad 5 (a real pad on the drain net), overlapping the drain lead pads 5-8."
cite     = "DS p.1, pin diagram (PG-TDSON-8), Drain Pin 5-8, tab"

[[pin]]
number   = "6"
name     = "D"
type     = "passive"
function = "Drain, discrete MOSFET terminal; same drain node as pin 5"
cite     = "DS p.1, pin diagram (PG-TDSON-8), Drain Pin 5-8, tab"

[[pin]]
number   = "7"
name     = "D"
type     = "passive"
function = "Drain, discrete MOSFET terminal; same drain node as pin 5"
cite     = "DS p.1, pin diagram (PG-TDSON-8), Drain Pin 5-8, tab"

[[pin]]
number   = "8"
name     = "D"
type     = "passive"
function = "Drain, discrete MOSFET terminal; same drain node as pin 5"
cite     = "DS p.1, pin diagram (PG-TDSON-8), Drain Pin 5-8, tab"

# ---------------------------------------------------------------------------------------------------------------
# Maximum ratings: DS p.3, Table 2 "Maximum ratings", at TA = 25 degC unless the row says otherwise.
# VDS: the Maximum ratings table has no VDS row. VDS = 100 V is the DS key performance parameter (DS p.1, Table 1).
