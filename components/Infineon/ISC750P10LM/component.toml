[param.vds_rating]
name       = "Drain-source voltage rating"
symbol     = "VDS"
kind       = "rec_op"
scope      = "na"
min        = -100
unit       = "V"
conditions = ""
cite       = "DS p.1, Table 1 Key Performance Parameters, VDS"
note       = "Not a row of the Maximum ratings table (DS p.3). P-channel: the limit is on the negative side, so it is stored as min = -100 (numeric order), not max. The DS gives no temperature for it. The guaranteed breakdown is V(BR)DSS = -100 V at 25 degC (vbr_dss, DS p.4 Table 4), the same value."
