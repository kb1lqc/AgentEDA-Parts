# ISC750P10LM: -100 V P-channel OptiMOS Power-Transistor, PG-TDSON-8 (SuperSO8). Source: docs/datasheets/infineon/
# infineon-isc750p10lm-datasheet-en.pdf, Final Data Sheet Rev.2.0, 2022-10-13. Raw datasheet values in printed units;
# negative values are stored signed as printed. Where the DS prints a negative pair in magnitude order (MIN -1, MAX -2),
# the row is stored in numeric order (min = printed MAX, max = printed MIN) and the note quotes the printed columns.
# Electrical rows are at Tj = 25 degC (DS p.4, "at Tj=25 degC, unless otherwise specified") and carry scope "25C".
# Rows with a single stated temperature in their own condition (Tj = 125 degC, TC = 25 degC) carry scope "na".
# Charge (nC) and energy (mJ) rows are loaded: lib/units.py accepts C and J (coordinator, this revision).

# Footprint: Infineon land pattern kept (the DS prints none). Its 4.42 x 4.31 mm tab pad is 0.09 mm narrower than the DS exposed-tab D1 max (4.40-4.31 vs 3.90-4.40 x 3.88-4.31, DS p.10 Figure 1): open item.
[part]
value           = "ISC750P10LM"
mpn             = "ISC750P10LM"                # DS p.1 Type/Ordering Code prints the type name only; no reel suffix printed (open item)
# Unverified: the user's vendor downloads are named ISC750P10LMATMA1. The DS prints no suffix, so mpn stays the type name.
manufacturer    = "Infineon Technologies"
description     = "-100 V P-channel OptiMOS Power-Transistor, logic level, -32 A, 75 mohm max at VGS = -10 V, PG-TDSON-8 (SuperSO8)"
category        = "mosfet"
package         = "PG-TDSON-8 (SuperSO8)"
datasheet_url   = "https://www.infineon.com"  # DS prints no part-specific URL (open item)
datasheet_file  = "docs/datasheets/infineon/infineon-isc750p10lm-datasheet-en.pdf"
datasheet_rev   = "Rev.2.0"
datasheet_date  = "2022-10-13"                 # DS p.1 footer, Rev.2.0,2022-10-13
temp_grade      = "-55 to 175 degC"            # informational: Tj,Tstg range (DS p.3 Table 2), a junction range
kicad_symbol    = "ISC750P10LM.kicad_sym"
kicad_footprint = "ISC750P10LM.kicad_mod"
step            = "none"                      # no STEP supplied (open item)
# Lead finish: "Pb-free lead plating; RoHS compliant" (DS p.1 Features). MSL: not printed in the DS (open item).

# Pins: DS p.1 pin diagram (SuperSO8 / PG-TDSON-8). Pins 1-3 source, pin 4 gate, pins 5-8 drain. The diagram prints the drain
# label as "Drain Pin 5-8": the drain pad under the package has NO printed number, so there is no pin for it (open item).
# Discrete transistor: S, D and G are passive terminals (function text states it).

[[pin]]
number   = "1"
name     = "S"
type     = "passive"
function = "Source, discrete MOSFET terminal; pins 1 to 3 are one source node (DS p.1 pin diagram 'Source Pin 1-3')"
cite     = "DS p.1, pin diagram (SuperSO8), Source Pin 1-3"

[[pin]]
number   = "2"
name     = "S"
type     = "passive"
function = "Source, discrete MOSFET terminal; same source node as pin 1"
cite     = "DS p.1, pin diagram (SuperSO8), Source Pin 1-3"

[[pin]]
number   = "3"
name     = "S"
type     = "passive"
function = "Source, discrete MOSFET terminal; same source node as pin 1"
cite     = "DS p.1, pin diagram (SuperSO8), Source Pin 1-3"

[[pin]]
number   = "4"
name     = "G"
type     = "passive"
function = "Gate, discrete MOSFET terminal (DS p.1 pin diagram 'Gate Pin 4')"
cite     = "DS p.1, pin diagram (SuperSO8), Gate Pin 4"

[[pin]]
number   = "5"
name     = "D"
type     = "passive"
function = "Drain, discrete MOSFET terminal; pins 5 to 8 are one drain node (DS p.1 pin diagram 'Drain Pin 5-8'). The drain tab (exposed pad) has no DS number and is not a separate pin: the footprint makes it pad 5 (a real pad on the drain net), overlapping the drain lead pads 5-8."
cite     = "DS p.1, pin diagram (SuperSO8), Drain Pin 5-8"

[[pin]]
number   = "6"
name     = "D"
type     = "passive"
function = "Drain, discrete MOSFET terminal; same drain node as pin 5"
cite     = "DS p.1, pin diagram (SuperSO8), Drain Pin 5-8"

[[pin]]
number   = "7"
name     = "D"
type     = "passive"
function = "Drain, discrete MOSFET terminal; same drain node as pin 5"
cite     = "DS p.1, pin diagram (SuperSO8), Drain Pin 5-8"

[[pin]]
number   = "8"
name     = "D"
type     = "passive"
function = "Drain, discrete MOSFET terminal; same drain node as pin 5"
cite     = "DS p.1, pin diagram (SuperSO8), Drain Pin 5-8"

# ---------------------------------------------------------------------------------------------------------------
# Maximum ratings: DS p.3, Table 2 "Maximum ratings", at TA = 25 degC unless the row says otherwise.
