[param.vds_rating]
name       = "Drain-source voltage rating"
symbol     = "VDS"
kind       = "rec_op"
scope      = "na"
max        = 100
unit       = "V"
conditions = ""
cite       = "DS p.1, Table 1 Key Performance Parameters, VDS"
note       = "Not in the Maximum ratings table (DS p.3); no temperature printed. Printed with no MIN/TYP/MAX label: stored as max, so only the upper bound is checked. Guaranteed minimum breakdown is V(BR)DSS = 100 V at 25 degC (vbr_dss, DS p.4 Table 4). The body-diode negative drain voltage is not a row in this DS."
check_pins = ["D"]
max_ref    = "S"

