# BSC040N10NS5: 100 V N-channel OptiMOS 5 power MOSFET, PG-TDSON-8 (SuperSO8). Source: docs/datasheets/infineon/
# infineon-bsc040n10ns5-datasheet-en.pdf, Final Data Sheet Rev.2.4, 2020-05-15. Raw datasheet values in printed units.
# Electrical rows are at Tj = 25 degC (DS p.4, "at Tj=25 degC, unless otherwise specified") and carry scope "25C".
# Rows with a single stated temperature in their own note/condition (Tj = 125 degC, TC = 25 degC) carry scope "na".
# Charge (nC) and energy (mJ) rows are loaded: lib/units.py accepts C and J (coordinator, this revision).

[part]
value           = "BSC040N10NS5"
mpn             = "BSC040N10NS5"               # DS p.1 Type/Ordering Code prints the type name only; no reel suffix printed (open item)
# Unverified: the user's vendor downloads are named BSC040N10NS5ATMA1. The DS prints no suffix, so mpn stays the type name.
manufacturer    = "Infineon Technologies"
description     = "100 V N-channel OptiMOS 5 power MOSFET, 136 A, 4.0 mohm max at VGS=10 V, PG-TDSON-8 (SuperSO8)"
category        = "mosfet"
package         = "PG-TDSON-8 (SuperSO8)"
datasheet_url   = "https://www.infineon.com"  # DS prints no part-specific URL (open item)
datasheet_file  = "docs/datasheets/infineon/infineon-bsc040n10ns5-datasheet-en.pdf"
datasheet_rev   = "Rev.2.4"
datasheet_date  = "2020-05-15"                # DS p.1 footer, Rev.2.4,2020-05-15
temp_grade      = "-55 to 150 degC"           # informational: Tj,Tstg range (DS p.3 Table 2), a junction range
kicad_symbol    = "BSC040N10NS5.kicad_sym"
kicad_footprint = "BSC040N10NS5.kicad_mod"
step            = "none"                      # no STEP supplied (open item)
# Lead finish: "Pb-free lead plating; RoHS compliant" (DS p.1 Features). MSL: not printed in the DS (open item).

# Pins: DS p.1 pin diagram (SuperSO8 / PG-TDSON-8). Pins 1-3 source, pin 4 gate, pins 5-8 drain. The figure prints no
# exposed-pad number (the drain pad under the package is not shown in the pin diagram), so there is no pin for it.
# Discrete transistor: S, D and G are passive terminals (function text states it).

[[pin]]
number   = "1"
name     = "S"
type     = "passive"
function = "Source (S1), discrete MOSFET terminal; S1, S2 and S3 are one source node"
cite     = "DS p.1, pin diagram (SuperSO8), S 1"

[[pin]]
number   = "2"
name     = "S"
type     = "passive"
function = "Source (S2), discrete MOSFET terminal; same source node as pin 1"
cite     = "DS p.1, pin diagram (SuperSO8), S 2"

[[pin]]
number   = "3"
name     = "S"
type     = "passive"
function = "Source (S3), discrete MOSFET terminal; same source node as pin 1"
cite     = "DS p.1, pin diagram (SuperSO8), S 3"

[[pin]]
number   = "4"
name     = "G"
type     = "passive"
function = "Gate (G4), discrete MOSFET terminal"
cite     = "DS p.1, pin diagram (SuperSO8), G 4"

[[pin]]
number   = "5"
name     = "D"
type     = "passive"
function = "Drain (D5), discrete MOSFET terminal; pins 5 to 8 are one drain node. The drain tab (exposed pad) has no DS number and is not a separate pin: the footprint makes it pad 5 (a real pad on the drain net), overlapping the drain lead pads 5-8."
cite     = "DS p.1, pin diagram (SuperSO8), 5 D"

[[pin]]
number   = "6"
name     = "D"
type     = "passive"
function = "Drain (D6), discrete MOSFET terminal; same drain node as pin 5"
cite     = "DS p.1, pin diagram (SuperSO8), 6 D"

[[pin]]
number   = "7"
name     = "D"
type     = "passive"
function = "Drain (D7), discrete MOSFET terminal; same drain node as pin 5"
cite     = "DS p.1, pin diagram (SuperSO8), 7 D"

[[pin]]
number   = "8"
name     = "D"
type     = "passive"
function = "Drain (D8), discrete MOSFET terminal; same drain node as pin 5"
cite     = "DS p.1, pin diagram (SuperSO8), 8 D"

# ---------------------------------------------------------------------------------------------------------------
# Maximum ratings: DS p.3, Table 2 "Maximum ratings", at TA = 25 degC unless the row says otherwise.
# VDS: the Maximum ratings table has no VDS row. VDS = 100 V is the DS key performance parameter (DS p.1, Table 1).
